  <circle class="miss-dot" cx="184" cy="162" r="2"/>
  <rect class="cell-miss" x="200" y="146" width="32" height="32"/>
  <circle class="miss-dot" cx="216" cy="162" r="2"/>
  <rect class="cell-miss" x="232" y="146" width="32" height="32"/>
