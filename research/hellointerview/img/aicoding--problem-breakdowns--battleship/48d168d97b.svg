<svg xmlns="http://www.w3.org/2000/svg" viewBox="30 40 340 340" font-family="ui-sans-serif, system-ui, sans-serif">
  <defs>
    <style>
      .cell { fill: #FFFFFF; stroke: #E6E8EC; stroke-width: 1; }
      .cell-miss { fill: #F2F4F7; stroke: #DFE3E8; stroke-width: 1; }
      .ship-cell { fill: #FFFFFF; stroke: #C4CDD5; stroke-width: 1.4; stroke-dasharray: 3 2; }
      .hit-cell { fill: #b5e0dd; stroke: #299a8d; stroke-width: 2; }
      .sunk-cell { fill: #299a8d; stroke: #227d70; stroke-width: 2; }
      .miss-dot { fill: #919EAB; }
    </style>
  </defs>

  <!-- Grid rows 0-9, cols 0-9. Cell 32x32, origin (40,50). -->

  <!-- Row 0: all miss -->
  <rect class="cell-miss" x="40" y="50" width="32" height="32"/>
  <circle class="miss-dot" cx="56" cy="66" r="2"/>
  <rect class="cell-miss" x="72" y="50" width="32" height="32"/>
