  <rect class="cell" x="232" y="242" width="32" height="32"/>
  <rect class="cell" x="264" y="242" width="32" height="32"/>
  <rect class="cell" x="296" y="242" width="32" height="32"/>
  <rect class="cell" x="328" y="242" width="32" height="32"/>

  <!-- Row 7: unfired -->
  <rect class="cell" x="40" y="274" width="32" height="32"/>
  <rect class="cell" x="72" y="274" width="32" height="32"/>
  <rect class="cell" x="104" y="274" width="32" height="32"/>
  <rect class="cell" x="136" y="274" width="32" height="32"/>
  <rect class="cell" x="168" y="274" width="32" height="32"/>
  <rect class="cell" x="200" y="274" width="32" height="32"/>
