  <!-- Row 9: unfired -->
  <rect class="cell" x="40" y="338" width="32" height="32"/>
  <rect class="cell" x="72" y="338" width="32" height="32"/>
  <rect class="cell" x="104" y="338" width="32" height="32"/>
  <rect class="cell" x="136" y="338" width="32" height="32"/>
  <rect class="cell" x="168" y="338" width="32" height="32"/>
  <rect class="cell" x="200" y="338" width="32" height="32"/>
  <rect class="cell" x="232" y="338" width="32" height="32"/>
  <rect class="cell" x="264" y="338" width="32" height="32"/>
  <rect class="cell" x="296" y="338" width="32" height="32"/>
  <rect class="cell" x="328" y="338" width="32" height="32"/>

  <!-- Highlighted hit/sunk cells drawn last so their thicker strokes sit on
       top of neighboring borders (SVG strokes are center-aligned). -->
  <rect class="hit-cell"  x="168" y="114" width="32" height="32"/>
  <rect class="hit-cell"  x="200" y="114" width="32" height="32"/>
  <rect class="sunk-cell" x="232" y="114" width="32" height="32"/>

  <!-- Ghost outline for row 2 cruiser (show ship position) behind HIT/SUNK -->
  <rect x="168" y="114" width="96" height="32" fill="none" stroke="#C4CDD5" stroke-width="1.4" stroke-dasharray="3 2"/>
  <rect x="72" y="242" width="96" height="32" fill="none" stroke="#C4CDD5" stroke-width="1.4" stroke-dasharray="3 2"/>

</svg>
