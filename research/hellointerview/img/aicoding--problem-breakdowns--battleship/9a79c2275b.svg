  <!-- Row 2: r=2. Hunt where (2+c)%3==0 → c=1,4,7. Plus (2,4) is HIT (drawn later). -->
  <rect class="cell" x="40" y="106" width="28" height="28"/>
  <rect class="hunt-cell" x="68" y="106" width="28" height="28"/>
  <rect class="cell" x="96" y="106" width="28" height="28"/>
