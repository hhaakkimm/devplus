<svg xmlns="http://www.w3.org/2000/svg" viewBox="30 40 790 300" font-family="ui-sans-serif, system-ui, sans-serif">
  <defs>
    <style>
      .cell { fill: #FFFFFF; stroke: #E6E8EC; stroke-width: 1; }
      .cell-miss { fill: #F2F4F7; stroke: #DFE3E8; stroke-width: 1; }
      .hunt-cell { fill: #F1F7F6; stroke: #b5e0dd; stroke-width: 1.2; }
      .ship-cell { fill: #FFFFFF; stroke: #C4CDD5; stroke-width: 1.4; stroke-dasharray: 3 2; }
      .hit-cell { fill: #59b9b0; stroke: #227d70; stroke-width: 2; }
      .sunk-cell { fill: #299a8d; stroke: #195045; stroke-width: 2; }
      .miss-dot { fill: #919EAB; }
      .transition-arrow { stroke: #299a8d; stroke-width: 2.4; fill: none; }
    </style>
  </defs>

  <!-- LEFT PANEL: hunt phase. Grid origin (40, 50), cell 28px. Grid 280x280. -->

  <!-- Hunt pattern cells: (r+c)%3==0. Draw all cells first. -->
  <!-- Row 0 -->
  <rect class="hunt-cell" x="40" y="50" width="28" height="28"/>
  <rect class="cell" x="68" y="50" width="28" height="28"/>
  <rect class="cell" x="96" y="50" width="28" height="28"/>
  <rect class="hunt-cell" x="124" y="50" width="28" height="28"/>
  <rect class="cell" x="152" y="50" width="28" height="28"/>
  <rect class="cell" x="180" y="50" width="28" height="28"/>
  <rect class="hunt-cell" x="208" y="50" width="28" height="28"/>
  <rect class="cell" x="236" y="50" width="28" height="28"/>
  <rect class="cell" x="264" y="50" width="28" height="28"/>
  <rect class="hunt-cell" x="292" y="50" width="28" height="28"/>

  <!-- Row 1: r=1. Hunt where (1+c)%3==0 → c=2,5,8 -->
  <rect class="cell" x="40" y="78" width="28" height="28"/>
  <rect class="cell" x="68" y="78" width="28" height="28"/>
  <rect class="hunt-cell" x="96" y="78" width="28" height="28"/>
