<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" font-family="ui-sans-serif, system-ui, sans-serif">
  <defs>
    <style>
      .edge { stroke: #919EAB; stroke-width: 1.4; fill: none; }
      .edge-pick { stroke: #299a8d; stroke-width: 2.7; fill: none; }
      .edge-cached { stroke: #2c9c59; stroke-width: 2.7; stroke-dasharray: 7,4; fill: none; }
      .red-node { fill: #e76f51; stroke: #da5233; stroke-width: 2; }
      .red-node-hit { fill: #e76f51; stroke: #2c9c59; stroke-width: 3; }
      .yellow-node { fill: #f4a261; stroke: #e6773c; stroke-width: 2; }
      .leaf-node { fill: #FFFFFF; stroke: #919EAB; stroke-width: 1.5; }
      .leaf-node-pick { fill: #F1F7F6; stroke: #299a8d; stroke-width: 2.4; }
      .red-text { fill: #FFFFFF; font-family: ui-monospace, SFMono-Regular, monospace; font-size: 15px; font-weight: 700; text-anchor: middle; dominant-baseline: central; }
      .yellow-text { fill: #212B36; font-family: ui-monospace, SFMono-Regular, monospace; font-size: 15px; font-weight: 700; text-anchor: middle; dominant-baseline: central; }
      .leaf-text { fill: #212B36; font-family: ui-monospace, SFMono-Regular, monospace; font-size: 13px; font-weight: 700; text-anchor: middle; dominant-baseline: central; }
      .row-tag { font-size: 13px; font-weight: 700; text-anchor: start; dominant-baseline: central; }
      .tag-red { fill: #da5233; }
      .tag-yellow { fill: #e6773c; }
      .tag-leaf { fill: #637381; }
      .move-label { fill: #454F5B; font-family: ui-monospace, SFMono-Regular, monospace; font-size: 12px; font-weight: 600; text-anchor: middle; dominant-baseline: central; }
      .label-bg { fill: #FFFFFF; }
      .panel { fill: #FDF8F3; stroke: #f4a261; stroke-width: 1.5; }
      .panel-title { fill: #e6773c; font-size: 12px; font-weight: 700; text-anchor: middle; }
      .panel-text { fill: #454F5B; font-family: ui-monospace, SFMono-Regular, monospace; font-size: 11px; text-anchor: start; dominant-baseline: central; }
      .annot { fill: #637381; font-size: 12px; text-anchor: middle; }
      .annot-pick { fill: #299a8d; font-size: 13px; font-weight: 700; text-anchor: middle; }
      .annot-cache { fill: #2c9c59; font-size: 12px; font-weight: 700; text-anchor: middle; }
    </style>
  </defs>

  <text class="row-tag tag-red" x="20" y="60">RED to move</text>
  <text class="row-tag tag-yellow" x="20" y="200">YELLOW to move</text>
  <text class="row-tag tag-red" x="20" y="330">RED to move</text>
  <text class="row-tag tag-leaf" x="20" y="430">cached subtree</text>

  <path class="edge-pick" d="M 330,80 L 210,220"/>
  <path class="edge" d="M 330,80 L 450,220"/>
  <path class="edge-pick" d="M 210,220 L 330,350"/>
  <path class="edge-cached" d="M 450,220 L 330,350"/>

  <rect class="label-bg" x="235" y="140" width="62" height="18" rx="3"/>
  <text class="move-label" x="266" y="150">RED col 3</text>
  <rect class="label-bg" x="360" y="140" width="62" height="18" rx="3"/>
  <text class="move-label" x="391" y="150">RED col 4</text>
  <rect class="label-bg" x="205" y="285" width="76" height="18" rx="3"/>
  <text class="move-label" x="243" y="295">YELLOW col 4</text>
  <rect class="label-bg" x="383" y="285" width="76" height="18" rx="3"/>
  <text class="move-label" x="421" y="295">YELLOW col 3</text>

  <path class="edge-pick" d="M 330,350 L 290,445"/>
  <path class="edge-pick" d="M 330,350 L 370,445"/>

  <circle class="red-node" cx="330" cy="80" r="27"/>
  <text class="red-text" x="330" y="80">start</text>

  <circle class="yellow-node" cx="210" cy="220" r="24"/>
  <text class="yellow-text" x="210" y="220">pos A</text>
  <circle class="yellow-node" cx="450" cy="220" r="24"/>
  <text class="yellow-text" x="450" y="220">pos B</text>

  <circle class="red-node-hit" cx="330" cy="350" r="28"/>
  <text class="red-text" x="330" y="350">−1</text>

  <circle class="leaf-node-pick" cx="290" cy="445" r="17"/>
  <text class="leaf-text" x="290" y="445">…</text>
  <circle class="leaf-node-pick" cx="370" cy="445" r="17"/>
  <text class="leaf-text" x="370" y="445">…</text>

  <rect class="panel" x="600" y="185" width="250" height="115" rx="6"/>
  <text class="panel-title" x="725" y="205">transposition table</text>
  <text class="panel-text" x="620" y="235">key: (columns, depth, side)</text>
  <text class="panel-text" x="620" y="258">side: RED to move</text>
  <text class="panel-text" x="620" y="281">value: −1</text>
  <path class="edge-cached" d="M 600,270 L 360,350"/>

  <text class="annot-pick" x="330" y="35">first path computes and stores the shared position</text>
  <text class="annot-cache" x="515" y="365">second path: cache hit</text>
  <text class="annot" x="330" y="495">different move orders converge to the same RED-to-move board</text>
</svg>
