<svg xmlns="http://www.w3.org/2000/svg" class="mx-auto block my-8" viewBox="0 0 640 500" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arrowCycle" markerheight="7" markerwidth="10" orient="auto" refx="10" refy="3.5"><polygon fill="#C4C4C4" points="0 0, 10 3.5, 0 7"></polygon></marker><marker id="arrowRed" markerheight="7" markerwidth="10" orient="auto" refx="10" refy="3.5"><polygon fill="#c0392b" points="0 0, 10 3.5, 0 7"></polygon></marker></defs><text fill="#666" font-size="13" font-weight="bold" x="20" y="25">Graph with a cycle: D depends on B, but B depends on D (through C)</text><line marker-end="url(#arrowCycle)" stroke="#C4C4C4" stroke-width="2" x1="86" x2="148" y1="80" y2="80"></line><line marker-end="url(#arrowCycle)" stroke="#C4C4C4" stroke-width="2" x1="196" x2="258" y1="80" y2="80"></line><line marker-end="url(#arrowCycle)" stroke="#C4C4C4" stroke-width="2" x1="296" x2="256" y1="96" y2="150"></line><path d="M 218 160 C 160 180, 140 130, 162 92" fill="none" marker-end="url(#arrowRed)" stroke="#c0392b" stroke-dasharray="6,3" stroke-width="2.5"></path><circle cx="60" cy="80" fill="#59b9b0" r="24"></circle><text fill="white" font-size="14" font-weight="bold" text-anchor="middle" x="60" y="86">A</text><text fill="#666" font-size="11" text-anchor="middle" x="60" y="120">in: 0</text><circle cx="170" cy="80" fill="#59b9b0" r="24"></circle><text fill="white" font-size="14" font-weight="bold" text-anchor="middle" x="170" y="86">B</text><text fill="#666" font-size="11" text-anchor="middle" x="170" y="120">in: 2</text><circle cx="280" cy="80" fill="#59b9b0" r="24"></circle><text fill="white" font-size="14" font-weight="bold" text-anchor="middle" x="280" y="86">C</text><text fill="#666" font-size="11" text-anchor="middle" x="280" y="120">in: 1</text><circle cx="240" cy="165" fill="#59b9b0" r="24"></circle><text fill="white" font-size="14" font-weight="bold" text-anchor="middle" x="240" y="171">D</text><text fill="#666" font-size="11" text-anchor="middle" x="240" y="205">in: 1</text><text fill="#c0392b" font-size="12" font-weight="bold" x="400" y="75">Cycle: B → C → D → B</text><text fill="#666" font-size="11" x="400" y="95">Dashed red arrow creates</text><text fill="#666" font-size="11" x="400" y="111">circular dependency</text><text fill="#666" font-size="13" font-weight="bold" x="20" y="260">Step 1: A has in-degree 0 — process it. Decrement B's in-degree.</text><line marker-end="url(#arrowCycle)" opacity="0.5" stroke="#C4C4C4" stroke-dasharray="4,3" stroke-width="2" x1="86" x2="148" y1="310" y2="310"></line><line marker-end="url(#arrowCycle)" stroke="#C4C4C4" stroke-width="2" x1="196" x2="258" y1="310" y2="310"></line><line marker-end="url(#arrowCycle)" stroke="#C4C4C4" stroke-width="2" x1="276" x2="252" y1="328" y2="375"></line><path d="M 218 386 C 130 380, 120 320, 162 320" fill="none" marker-end="url(#arrowRed)" stroke="#c0392b" stroke-dasharray="6,3" stroke-width="2.5"></path><circle cx="60" cy="310" fill="rgb(41, 154, 141)" r="24"></circle><text fill="white" font-size="14" font-weight="bold" text-anchor="middle" x="60" y="316">A</text><circle cx="170" cy="310" fill="#59b9b0" r="24"></circle><text fill="white" font-size="14" font-weight="bold" text-anchor="middle" x="170" y="316">B</text><text fill="#c0392b" font-size="11" font-weight="bold" text-anchor="middle" x="170" y="350">in: 2→1</text><circle cx="280" cy="310" fill="#59b9b0" r="24"></circle><text fill="white" font-size="14" font-weight="bold" text-anchor="middle" x="280" y="316">C</text><text fill="#666" font-size="11" text-anchor="middle" x="280" y="350">in: 1</text><circle cx="240" cy="395" fill="#59b9b0" r="24"></circle><text fill="white" font-size="14" font-weight="bold" text-anchor="middle" x="240" y="401">D</text><text fill="#666" font-size="11" text-anchor="middle" x="240" y="435">in: 1</text><text fill="#666" font-size="13" font-weight="bold" x="20" y="485">Queue is empty. Result: [A] — only 1 of 4 nodes. Cycle detected!</text><text fill="#666" font-size="12" x="400" y="310">B never reaches in-degree 0</text><text fill="#666" font-size="12" x="400" y="330">because D still points to it,</text><text fill="#666" font-size="12" x="400" y="350">but D is waiting on C,</text><text fill="#666" font-size="12" x="400" y="370">which is waiting on B.</text><text fill="#c0392b" font-size="12" font-weight="bold" x="400" y="400">Deadlock.</text></svg>