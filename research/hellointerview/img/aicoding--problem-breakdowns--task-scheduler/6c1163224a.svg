<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 20 800 220" font-family="ui-sans-serif, system-ui, sans-serif">
  <defs>
    <style>
      .label { fill: #454F5B; font-size: 13px; font-weight: 600; }
      .sublabel { fill: #637381; font-size: 12px; }
      .axis-tick { fill: #919EAB; font-size: 11px; text-anchor: middle; font-family: ui-monospace, SFMono-Regular, monospace; }
      .axis-line { stroke: #DFE3E8; stroke-width: 1; }
      .block-scan { fill: #F9FAFB; stroke: #919EAB; stroke-width: 1.5; }
      .block-build { fill: #F1F7F6; stroke: #299a8d; stroke-width: 2; }
      .block-hit { fill: #d1fae5; stroke: #059669; stroke-width: 2.5; }
      .block-idle { fill: #FDF8F3; stroke: #f4a261; stroke-width: 1.5; stroke-dasharray: 4 3; }
      .block-text-build { fill: #227d70; font-size: 11px; font-weight: 700; text-anchor: middle; dominant-baseline: central; font-family: ui-monospace, SFMono-Regular, monospace; }
      .block-text-scan { fill: #637381; font-size: 11px; font-weight: 600; text-anchor: middle; dominant-baseline: central; font-family: ui-monospace, SFMono-Regular, monospace; }
      .block-text-hit { fill: #0b9d42; font-size: 11px; font-weight: 700; text-anchor: middle; dominant-baseline: central; font-family: ui-monospace, SFMono-Regular, monospace; }
      .block-text-idle { fill: #c2410c; font-size: 11px; font-style: italic; text-anchor: middle; dominant-baseline: central; }
      .makespan-line { stroke: #0b9d42; stroke-width: 2; stroke-dasharray: 6 3; }
      .makespan-text { fill: #0b9d42; font-size: 13px; font-weight: 700; text-anchor: middle; font-family: ui-monospace, SFMono-Regular, monospace; }
    </style>
  </defs>

  <!-- Same scale as fixed-order: 1 unit = 18px, origin x = 100 -->

  <!-- Axis -->
  <line class="axis-line" x1="100" y1="200" x2="770" y2="200"/>
  <g font-family="ui-monospace, SFMono-Regular, monospace">
    <text class="axis-tick" x="100" y="218">0</text>
    <text class="axis-tick" x="190" y="218">5</text>
    <text class="axis-tick" x="280" y="218">10</text>
    <text class="axis-tick" x="370" y="218">15</text>
    <text class="axis-tick" x="460" y="218">20</text>
    <text class="axis-tick" x="550" y="218">25</text>
    <text class="axis-tick" x="640" y="218">30</text>
    <text class="axis-tick" x="730" y="218">35</text>
  </g>

  <!-- Worker labels -->
  <text class="label" x="30" y="90">worker 0</text>
  <text class="label" x="30" y="150">worker 1</text>

  <!-- Worker 0: setup(0-1), build-1(1-9), build-2(9-17), build-3(17-25), idle(25-26) -->
  <rect class="block-build" x="100" y="70" width="18" height="30" rx="3"/>
  <text class="block-text-build" x="109" y="85" font-size="9">·</text>

  <rect class="block-hit" x="118" y="70" width="144" height="30" rx="3"/>
  <text class="block-text-hit" x="190" y="85">build-1</text>

  <rect class="block-hit" x="262" y="70" width="144" height="30" rx="3"/>
  <text class="block-text-hit" x="334" y="85">build-2</text>

  <rect class="block-hit" x="406" y="70" width="144" height="30" rx="3"/>
  <text class="block-text-hit" x="478" y="85">build-3</text>

  <rect class="block-idle" x="550" y="70" width="18" height="30" rx="3"/>
  <text class="block-text-idle" x="559" y="85" font-size="9">·</text>

  <!-- Worker 1: scan-a(0-6), scan-b(6-12), scan-c(12-18), scan-d(18-24), idle(24-25), finalize(25-26) -->
  <rect class="block-scan" x="100" y="130" width="108" height="30" rx="3"/>
  <text class="block-text-scan" x="154" y="145">scan-a</text>

  <rect class="block-scan" x="208" y="130" width="108" height="30" rx="3"/>
  <text class="block-text-scan" x="262" y="145">scan-b</text>

  <rect class="block-scan" x="316" y="130" width="108" height="30" rx="3"/>
  <text class="block-text-scan" x="370" y="145">scan-c</text>

  <rect class="block-scan" x="424" y="130" width="108" height="30" rx="3"/>
  <text class="block-text-scan" x="478" y="145">scan-d</text>

  <rect class="block-idle" x="532" y="130" width="18" height="30" rx="3"/>
  <text class="block-text-idle" x="541" y="145" font-size="9">·</text>

  <rect class="block-hit" x="550" y="130" width="18" height="30" rx="3"/>
  <text class="block-text-hit" x="559" y="145" font-size="9">·</text>

  <!-- Makespan marker at 26 -->
  <line class="makespan-line" x1="568" y1="50" x2="568" y2="200"/>

</svg>
