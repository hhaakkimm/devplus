<svg xmlns="http://www.w3.org/2000/svg" aria-label="The five signal sources used in real ML systems: content, actor, behavior, network, and context, with example signals and how a modern model consumes each" class="fe" role="img" style="display:block;margin:1.5rem auto;max-width:100%;height:auto" viewBox="0 0 760 496" xmlns="http://www.w3.org/2000/svg"><defs><marker id="fe-ah-grey" markerheight="6" markerwidth="6" orient="auto-start-reverse" refx="9" refy="5" viewBox="0 0 10 10"><path d="M 0 0 L 10 5 L 0 10 z" fill="#919EAB"></path></marker></defs><text class="hed" text-anchor="middle" x="380" y="32">Where real systems get signal</text><text class="note" text-anchor="middle" x="380" y="52">Five sources, repeated across almost every ML system design problem you'll see</text><text class="intake-label" text-anchor="middle" x="380" y="68">EXAMPLE SIGNALS</text><text class="intake-label" text-anchor="middle" x="664" y="68">MODEL INTAKE</text><g><rect class="row-bg-alt" height="78" width="760" x="0" y="76"></rect><rect class="b0-accent" height="50" rx="2" width="4" x="18" y="90"></rect><text class="title b0-name" x="32" y="108">Content / item</text><text class="note" x="32" y="126">the thing being scored</text><g><rect class="b0-chip" height="20" rx="4" width="148" x="220" y="90"></rect><text class="b0-chip-txt" text-anchor="middle" x="294" y="104">post text</text></g><g><rect class="b0-chip" height="20" rx="4" width="148" x="374" y="90"></rect><text class="b0-chip-txt" text-anchor="middle" x="448" y="104">thumbnail</text></g><g><rect class="b0-chip" height="20" rx="4" width="148" x="220" y="114"></rect><text class="b0-chip-txt" text-anchor="middle" x="294" y="128">audio</text></g><g><rect class="b0-chip" height="20" rx="4" width="148" x="374" y="114"></rect><text class="b0-chip-txt" text-anchor="middle" x="448" y="128">metadata</text></g><path class="arrow" d="M 542 115 L 560 115" marker-end="url(#fe-ah-grey)"></path><text class="intake" x="564" y="112">raw text → tokens</text><text class="intake" x="564" y="128">raw image → patches</text></g><g><rect class="row-bg" height="78" width="760" x="0" y="154"></rect><rect class="b1-accent" height="50" rx="2" width="4" x="18" y="168"></rect><text class="title b1-name" x="32" y="186">Actor / creator / user</text><text class="note" x="32" y="204">who's involved</text><g><rect class="b1-chip" height="20" rx="4" width="148" x="220" y="168"></rect><text class="b1-chip-txt" text-anchor="middle" x="294" y="182">taste embedding</text></g><g><rect class="b1-chip" height="20" rx="4" width="148" x="374" y="168"></rect><text class="b1-chip-txt" text-anchor="middle" x="448" y="182">account age</text></g><g><rect class="b1-chip" height="20" rx="4" width="148" x="220" y="192"></rect><text class="b1-chip-txt" text-anchor="middle" x="294" y="206">profile attrs</text></g><path class="arrow" d="M 542 193 L 560 193" marker-end="url(#fe-ah-grey)"></path><text class="intake" x="564" y="190">upstream embedding</text><text class="intake" x="564" y="206">+ a few explicit attributes</text></g><g><rect class="row-bg-alt" height="78" width="760" x="0" y="232"></rect><rect class="b2-accent" height="50" rx="2" width="4" x="18" y="246"></rect><text class="title b2-name" x="32" y="264">Behavior / engagement</text><text class="note" x="32" y="282">what happened</text><g><rect class="b2-chip" height="20" rx="4" width="148" x="220" y="246"></rect><text class="b2-chip-txt" text-anchor="middle" x="294" y="260">recent watch sequence</text></g><g><rect class="b2-chip" height="20" rx="4" width="148" x="374" y="246"></rect><text class="b2-chip-txt" text-anchor="middle" x="448" y="260">view velocity</text></g><g><rect class="b2-chip" height="20" rx="4" width="148" x="220" y="270"></rect><text class="b2-chip-txt" text-anchor="middle" x="294" y="284">report rate</text></g><path class="arrow" d="M 542 271 L 560 271" marker-end="url(#fe-ah-grey)"></path><text class="intake" x="564" y="268">sequence-as-tokens (heavy)</text><text class="intake" x="564" y="284">aggregates (light ranker)</text></g><g><rect class="row-bg" height="78" width="760" x="0" y="310"></rect><rect class="b3-accent" height="50" rx="2" width="4" x="18" y="324"></rect><text class="title b3-name" x="32" y="342">Network / graph</text><text class="note" x="32" y="360">relationships</text><g><rect class="b3-chip" height="20" rx="4" width="148" x="220" y="324"></rect><text class="b3-chip-txt" text-anchor="middle" x="294" y="338">GNN embedding</text></g><g><rect class="b3-chip" height="20" rx="4" width="148" x="374" y="324"></rect><text class="b3-chip-txt" text-anchor="middle" x="448" y="338">co-watcher overlap</text></g><g><rect class="b3-chip" height="20" rx="4" width="148" x="220" y="348"></rect><text class="b3-chip-txt" text-anchor="middle" x="294" y="362">follower position</text></g><path class="arrow" d="M 542 349 L 560 349" marker-end="url(#fe-ah-grey)"></path><text class="intake" x="564" y="346">graph embedding</text><text class="intake" x="564" y="362">fed as feature</text></g><g><rect class="row-bg-alt" height="78" width="760" x="0" y="388"></rect><rect class="b4-accent" height="50" rx="2" width="4" x="18" y="402"></rect><text class="title b4-name" x="32" y="420">Context / request</text><text class="note" x="32" y="438">the call itself</text><g><rect class="b4-chip" height="20" rx="4" width="148" x="220" y="402"></rect><text class="b4-chip-txt" text-anchor="middle" x="294" y="416">time of day</text></g><g><rect class="b4-chip" height="20" rx="4" width="148" x="374" y="402"></rect><text class="b4-chip-txt" text-anchor="middle" x="448" y="416">device</text></g><g><rect class="b4-chip" height="20" rx="4" width="148" x="220" y="426"></rect><text class="b4-chip-txt" text-anchor="middle" x="294" y="440">current page</text></g><g><rect class="b4-chip" height="20" rx="4" width="148" x="374" y="426"></rect><text class="b4-chip-txt" text-anchor="middle" x="448" y="440">geo</text></g><path class="arrow" d="M 542 427 L 560 427" marker-end="url(#fe-ah-grey)"></path><text class="intake" x="564" y="424">small dense vector</text><text class="intake" x="564" y="440">concatenated at input</text></g></svg>