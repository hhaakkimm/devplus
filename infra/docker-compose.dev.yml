name: devplus

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: devplus
      POSTGRES_PASSWORD: devplus
      POSTGRES_DB: devplus
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/postgres-init.sql:ro
    healthcheck:
      # -h 127.0.0.1: the init-time server listens on the unix socket only, so this waits for the real one
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U devplus -d devplus"]
      interval: 2s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres-data:
