<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 10 510 275" font-family="ui-sans-serif, system-ui, sans-serif">
  <defs>
    <style>
      .word { fill: #212B36; font-family: ui-monospace, SFMono-Regular, monospace; font-size: 13px; font-weight: 700; text-anchor: end; dominant-baseline: central; }
      .bit-off { fill: #FFFFFF; stroke: #C4CDD5; stroke-width: 1; }
      .bit-on { fill: #F1F7F6; stroke: #299a8d; stroke-width: 1.6; }
      .bit-used { fill: #299a8d; stroke: #227d70; stroke-width: 1.6; }
      .bit-text-off { fill: #919EAB; font-family: ui-monospace, SFMono-Regular, monospace; font-size: 10px; text-anchor: middle; dominant-baseline: central; }
      .bit-text-on { fill: #227d70; font-family: ui-monospace, SFMono-Regular, monospace; font-size: 10px; font-weight: 700; text-anchor: middle; dominant-baseline: central; }
      .bit-text-used { fill: #FFFFFF; font-family: ui-monospace, SFMono-Regular, monospace; font-size: 10px; font-weight: 700; text-anchor: middle; dominant-baseline: central; }
      .header { fill: #637381; font-family: ui-monospace, SFMono-Regular, monospace; font-size: 10px; text-anchor: middle; dominant-baseline: central; font-weight: 600; }
      .pop-chip { fill: #F9FAFB; stroke: #DFE3E8; stroke-width: 1; }
      .pop-chip-text { fill: #454F5B; font-family: ui-monospace, SFMono-Regular, monospace; font-size: 11px; font-weight: 700; text-anchor: middle; dominant-baseline: central; }
      .divider { stroke: #DFE3E8; stroke-width: 1; }
      .or-label { fill: #227d70; font-family: ui-monospace, SFMono-Regular, monospace; font-size: 12px; font-weight: 700; text-anchor: end; dominant-baseline: central; }
      .calc-text { fill: #454F5B; font-family: ui-monospace, SFMono-Regular, monospace; font-size: 12px; }
      .calc-num { fill: #212B36; font-family: ui-monospace, SFMono-Regular, monospace; font-size: 13px; font-weight: 700; }
    </style>
  </defs>

