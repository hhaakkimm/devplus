<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 10 510 275" font-family="ui-sans-serif, system-ui, sans-serif">
  <defs>
    <style>
      .word { fill: #212B36; font-family: ui-monospace, SFMono-Regular, monospace; font-size: 13px; font-weight: 700; text-anchor: end; dominant-baseline: central; }
      .cell-off { fill: #FFFFFF; stroke: #C4CDD5; stroke-width: 1; }
      .cell-on { fill: #F1F7F6; stroke: #299a8d; stroke-width: 1.6; }
      .cell-used { fill: #299a8d; stroke: #227d70; stroke-width: 1.6; }
      .letter-on { fill: #227d70; font-family: ui-monospace, SFMono-Regular, monospace; font-size: 11px; font-weight: 700; text-anchor: middle; dominant-baseline: central; }
      .letter-used { fill: #FFFFFF; font-family: ui-monospace, SFMono-Regular, monospace; font-size: 11px; font-weight: 700; text-anchor: middle; dominant-baseline: central; }
      .header { fill: #637381; font-family: ui-monospace, SFMono-Regular, monospace; font-size: 10px; text-anchor: middle; dominant-baseline: central; font-weight: 600; }
      .size-chip { fill: #F9FAFB; stroke: #DFE3E8; stroke-width: 1; }
      .size-chip-text { fill: #454F5B; font-family: ui-monospace, SFMono-Regular, monospace; font-size: 11px; font-weight: 700; text-anchor: middle; dominant-baseline: central; }
      .divider { stroke: #DFE3E8; stroke-width: 1; }
      .row-label { fill: #227d70; font-family: ui-monospace, SFMono-Regular, monospace; font-size: 12px; font-weight: 700; text-anchor: end; dominant-baseline: central; }
    </style>
  </defs>

  <!-- Header row: letter columns a..j plus |set| -->
  <text class="header" x="175" y="30">a</text>
  <text class="header" x="205" y="30">b</text>
  <text class="header" x="235" y="30">c</text>
  <text class="header" x="265" y="30">d</text>
  <text class="header" x="295" y="30">e</text>
  <text class="header" x="325" y="30">f</text>
  <text class="header" x="355" y="30">g</text>
  <text class="header" x="385" y="30">h</text>
  <text class="header" x="415" y="30">i</text>
  <text class="header" x="445" y="30">j</text>
  <text class="header" x="494" y="30">|set|</text>

  <!-- Row 1: picked {a,b,c} (already in `used`) -->
  <text class="word" x="155" y="55">abc (picked)</text>
  <rect class="cell-used" x="160" y="42" width="24" height="24" rx="3"/><text class="letter-used" x="172" y="55">a</text>
  <rect class="cell-used" x="190" y="42" width="24" height="24" rx="3"/><text class="letter-used" x="202" y="55">b</text>
  <rect class="cell-used" x="220" y="42" width="24" height="24" rx="3"/><text class="letter-used" x="232" y="55">c</text>
  <rect class="cell-off"  x="250" y="42" width="24" height="24" rx="3"/>
  <rect class="cell-off"  x="280" y="42" width="24" height="24" rx="3"/>
  <rect class="cell-off"  x="310" y="42" width="24" height="24" rx="3"/>
  <rect class="cell-off"  x="340" y="42" width="24" height="24" rx="3"/>
  <rect class="cell-off"  x="370" y="42" width="24" height="24" rx="3"/>
  <rect class="cell-off"  x="400" y="42" width="24" height="24" rx="3"/>
  <rect class="cell-off"  x="430" y="42" width="24" height="24" rx="3"/>
  <rect class="size-chip" x="470" y="42" width="48" height="24" rx="4"/>
  <text class="size-chip-text" x="494" y="55">3</text>

  <line class="divider" x1="30" y1="78" x2="520" y2="78"/>

  <!-- Row 2: def char set -->
  <text class="word" x="155" y="120">def</text>
  <rect class="cell-off" x="160" y="107" width="24" height="24" rx="3"/>
  <rect class="cell-off" x="190" y="107" width="24" height="24" rx="3"/>
  <rect class="cell-off" x="220" y="107" width="24" height="24" rx="3"/>
  <rect class="cell-on"  x="250" y="107" width="24" height="24" rx="3"/><text class="letter-on" x="262" y="120">d</text>
  <rect class="cell-on"  x="280" y="107" width="24" height="24" rx="3"/><text class="letter-on" x="292" y="120">e</text>
  <rect class="cell-on"  x="310" y="107" width="24" height="24" rx="3"/><text class="letter-on" x="322" y="120">f</text>
  <rect class="cell-off" x="340" y="107" width="24" height="24" rx="3"/>
  <rect class="cell-off" x="370" y="107" width="24" height="24" rx="3"/>
  <rect class="cell-off" x="400" y="107" width="24" height="24" rx="3"/>
  <rect class="cell-off" x="430" y="107" width="24" height="24" rx="3"/>
  <rect class="size-chip" x="470" y="107" width="48" height="24" rx="4"/>
  <text class="size-chip-text" x="494" y="120">3</text>

  <!-- Row 3: cd char set -->
  <text class="word" x="155" y="150">cd</text>
  <rect class="cell-off" x="160" y="137" width="24" height="24" rx="3"/>
  <rect class="cell-off" x="190" y="137" width="24" height="24" rx="3"/>
  <rect class="cell-on"  x="220" y="137" width="24" height="24" rx="3"/><text class="letter-on" x="232" y="150">c</text>
  <rect class="cell-on"  x="250" y="137" width="24" height="24" rx="3"/><text class="letter-on" x="262" y="150">d</text>
  <rect class="cell-off" x="280" y="137" width="24" height="24" rx="3"/>
  <rect class="cell-off" x="310" y="137" width="24" height="24" rx="3"/>
  <rect class="cell-off" x="340" y="137" width="24" height="24" rx="3"/>
  <rect class="cell-off" x="370" y="137" width="24" height="24" rx="3"/>
  <rect class="cell-off" x="400" y="137" width="24" height="24" rx="3"/>
  <rect class="cell-off" x="430" y="137" width="24" height="24" rx="3"/>
  <rect class="size-chip" x="470" y="137" width="48" height="24" rx="4"/>
  <text class="size-chip-text" x="494" y="150">2</text>

  <!-- Row 4: gh char set -->
  <text class="word" x="155" y="180">gh</text>
  <rect class="cell-off" x="160" y="167" width="24" height="24" rx="3"/>
  <rect class="cell-off" x="190" y="167" width="24" height="24" rx="3"/>
  <rect class="cell-off" x="220" y="167" width="24" height="24" rx="3"/>
  <rect class="cell-off" x="250" y="167" width="24" height="24" rx="3"/>
  <rect class="cell-off" x="280" y="167" width="24" height="24" rx="3"/>
  <rect class="cell-off" x="310" y="167" width="24" height="24" rx="3"/>
  <rect class="cell-on"  x="340" y="167" width="24" height="24" rx="3"/><text class="letter-on" x="352" y="180">g</text>
  <rect class="cell-on"  x="370" y="167" width="24" height="24" rx="3"/><text class="letter-on" x="382" y="180">h</text>
  <rect class="cell-off" x="400" y="167" width="24" height="24" rx="3"/>
  <rect class="cell-off" x="430" y="167" width="24" height="24" rx="3"/>
  <rect class="size-chip" x="470" y="167" width="48" height="24" rx="4"/>
  <text class="size-chip-text" x="494" y="180">2</text>

  <line class="divider" x1="30" y1="200" x2="520" y2="200"/>

  <!-- Suffix union row: union of def, cd, gh -->
  <text class="row-label" x="155" y="222">suffix_union[1]</text>
  <rect class="cell-off" x="160" y="209" width="24" height="24" rx="3"/>
  <rect class="cell-off" x="190" y="209" width="24" height="24" rx="3"/>
  <rect class="cell-on"  x="220" y="209" width="24" height="24" rx="3"/><text class="letter-on" x="232" y="222">c</text>
  <rect class="cell-on"  x="250" y="209" width="24" height="24" rx="3"/><text class="letter-on" x="262" y="222">d</text>
  <rect class="cell-on"  x="280" y="209" width="24" height="24" rx="3"/><text class="letter-on" x="292" y="222">e</text>
  <rect class="cell-on"  x="310" y="209" width="24" height="24" rx="3"/><text class="letter-on" x="322" y="222">f</text>
  <rect class="cell-on"  x="340" y="209" width="24" height="24" rx="3"/><text class="letter-on" x="352" y="222">g</text>
  <rect class="cell-on"  x="370" y="209" width="24" height="24" rx="3"/><text class="letter-on" x="382" y="222">h</text>
  <rect class="cell-off" x="400" y="209" width="24" height="24" rx="3"/>
  <rect class="cell-off" x="430" y="209" width="24" height="24" rx="3"/>
  <rect class="size-chip" x="470" y="209" width="48" height="24" rx="4"/>
  <text class="size-chip-text" x="494" y="222">6</text>

  <!-- Set difference row: suffix_union[1] − used -->
  <text class="row-label" x="155" y="258">− used</text>
  <rect class="cell-off" x="160" y="245" width="24" height="24" rx="3"/>
  <rect class="cell-off" x="190" y="245" width="24" height="24" rx="3"/>
  <rect class="cell-off" x="220" y="245" width="24" height="24" rx="3"/>
  <rect class="cell-on"  x="250" y="245" width="24" height="24" rx="3"/><text class="letter-on" x="262" y="258">d</text>
  <rect class="cell-on"  x="280" y="245" width="24" height="24" rx="3"/><text class="letter-on" x="292" y="258">e</text>
  <rect class="cell-on"  x="310" y="245" width="24" height="24" rx="3"/><text class="letter-on" x="322" y="258">f</text>
  <rect class="cell-on"  x="340" y="245" width="24" height="24" rx="3"/><text class="letter-on" x="352" y="258">g</text>
  <rect class="cell-on"  x="370" y="245" width="24" height="24" rx="3"/><text class="letter-on" x="382" y="258">h</text>
  <rect class="cell-off" x="400" y="245" width="24" height="24" rx="3"/>
  <rect class="cell-off" x="430" y="245" width="24" height="24" rx="3"/>
  <rect class="size-chip" x="470" y="245" width="48" height="24" rx="4"/>
  <text class="size-chip-text" x="494" y="258">5</text>

</svg>
