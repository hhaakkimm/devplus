  <rect class="cell-filled" x="258" y="96" width="36" height="36"/>
  <rect class="cell-filled" x="294" y="96" width="36" height="36"/>

  <rect class="cell-empty"  x="150" y="132" width="36" height="36"/>
  <text class="empty-dot" x="168" y="150">.</text>
  <rect class="cell-current" x="186" y="132" width="36" height="36"/>
  <text class="cur-mark" x="204" y="150">#?</text>
  <rect class="cell-unknown" x="222" y="132" width="36" height="36"/>
  <text class="unk-mark" x="240" y="150">?</text>
  <rect class="cell-unknown" x="258" y="132" width="36" height="36"/>
  <text class="unk-mark" x="276" y="150">?</text>
  <rect class="cell-unknown" x="294" y="132" width="36" height="36"/>
  <text class="unk-mark" x="312" y="150">?</text>

  <rect class="cell-unknown" x="150" y="168" width="36" height="36"/>
  <text class="unk-mark" x="168" y="186">?</text>
  <rect class="cell-unknown" x="186" y="168" width="36" height="36"/>
  <text class="unk-mark" x="204" y="186">?</text>
  <rect class="cell-unknown" x="222" y="168" width="36" height="36"/>
  <text class="unk-mark" x="240" y="186">?</text>
  <rect class="cell-unknown" x="258" y="168" width="36" height="36"/>
  <text class="unk-mark" x="276" y="186">?</text>
  <rect class="cell-unknown" x="294" y="168" width="36" height="36"/>
  <text class="unk-mark" x="312" y="186">?</text>

