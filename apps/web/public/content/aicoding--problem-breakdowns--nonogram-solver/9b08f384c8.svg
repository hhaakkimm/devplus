  <rect class="cell-unknown" x="186" y="204" width="36" height="36"/>
  <text class="unk-mark" x="204" y="222">?</text>
  <rect class="cell-unknown" x="222" y="204" width="36" height="36"/>
  <text class="unk-mark" x="240" y="222">?</text>
  <rect class="cell-unknown" x="258" y="204" width="36" height="36"/>
  <text class="unk-mark" x="276" y="222">?</text>
  <rect class="cell-unknown" x="294" y="204" width="36" height="36"/>
  <text class="unk-mark" x="312" y="222">?</text>

  <rect class="panel" x="380" y="52" width="260" height="152" rx="6"/>

  <g font-family="ui-monospace, SFMono-Regular, monospace" font-size="12px">
    <text class="trace-ok"      x="396" y="78">row 0  runs [1, 1]</text>
    <text class="trace-ok"      x="396" y="102">row 1  runs [5]</text>
    <text class="trace-cur"     x="396" y="126">row 2  (r=2, c=1) ← #</text>
    <text class="trace-pending" x="396" y="150">row 3  ?</text>
    <text class="trace-pending" x="396" y="174">row 4  ?</text>
