<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 260" font-family="ui-sans-serif, system-ui, sans-serif">
  <defs>
    <style>
      .clue { fill: #454F5B; font-family: ui-monospace, SFMono-Regular, monospace; font-size: 13px; text-anchor: middle; dominant-baseline: central; }
      .clue-row { fill: #454F5B; font-family: ui-monospace, SFMono-Regular, monospace; font-size: 13px; text-anchor: end; dominant-baseline: central; }
      .cell-filled { fill: #212B36; stroke: #454F5B; stroke-width: 1; }
      .cell-empty { fill: #FFFFFF; stroke: #919EAB; stroke-width: 1.2; }
      .cell-unknown { fill: #F9FAFB; stroke: #DFE3E8; stroke-width: 1; }
      .cell-current { fill: #F1F7F6; stroke: #299a8d; stroke-width: 2.5; }
      .empty-dot { fill: #919EAB; font-family: ui-monospace, SFMono-Regular, monospace; font-size: 16px; text-anchor: middle; dominant-baseline: central; }
      .unk-mark { fill: #C4CDD5; font-family: ui-monospace, SFMono-Regular, monospace; font-size: 16px; text-anchor: middle; dominant-baseline: central; }
      .cur-mark { fill: #227d70; font-family: ui-monospace, SFMono-Regular, monospace; font-size: 14px; font-weight: 700; text-anchor: middle; dominant-baseline: central; }
      .panel { fill: #F9FAFB; stroke: #DFE3E8; stroke-width: 1; }
      .trace-ok { fill: #0b9d42; font-family: ui-monospace, SFMono-Regular, monospace; font-size: 12px; font-weight: 700; }
      .trace-pending { fill: #919EAB; font-family: ui-monospace, SFMono-Regular, monospace; font-size: 12px; }
      .trace-cur { fill: #227d70; font-family: ui-monospace, SFMono-Regular, monospace; font-size: 12px; font-weight: 700; }
    </style>
  </defs>

  <text class="clue" x="168" y="42">2</text>
  <text class="clue" x="204" y="42">4</text>
  <text class="clue" x="240" y="42">4</text>
  <text class="clue" x="276" y="42">4</text>
  <text class="clue" x="312" y="42">2</text>

  <text class="clue-row" x="140" y="78">1 1</text>
  <text class="clue-row" x="140" y="114">5</text>
  <text class="clue-row" x="140" y="150">5</text>
  <text class="clue-row" x="140" y="186">3</text>
  <text class="clue-row" x="140" y="222">1</text>

  <rect class="cell-empty"  x="150" y="60" width="36" height="36"/>
