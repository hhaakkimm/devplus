<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 230" font-family="ui-sans-serif, system-ui, sans-serif">
  <defs>
    <style>
      .cell { fill: #FFFFFF; stroke: #919EAB; stroke-width: 1.5; }
      .cell-fix { fill: #F1F7F6; stroke: #299a8d; stroke-width: 2.5; }
      .cell-pair { fill: #d1fae5; stroke: #059669; stroke-width: 2.5; }
      .pos-lbl { fill: #919EAB; font-family: ui-monospace, SFMono-Regular, monospace; font-size: 10px; }
      .pos-lbl-fix { fill: #227d70; font-family: ui-monospace, SFMono-Regular, monospace; font-size: 10px; font-weight: 700; }
      .pos-lbl-pair { fill: #0b9d42; font-family: ui-monospace, SFMono-Regular, monospace; font-size: 10px; font-weight: 700; }
      .val { fill: #212B36; font-family: ui-monospace, SFMono-Regular, monospace; font-size: 15px; text-anchor: middle; dominant-baseline: central; }
      .val-bold { fill: #212B36; font-family: ui-monospace, SFMono-Regular, monospace; font-size: 15px; font-weight: 700; text-anchor: middle; dominant-baseline: central; }
      .step-hdr { fill: #454F5B; font-family: ui-sans-serif, system-ui, sans-serif; font-size: 12px; font-weight: 600; }
      .step-body { fill: #454F5B; font-family: ui-monospace, SFMono-Regular, monospace; font-size: 13px; }
      .step-muted { fill: #637381; font-family: ui-monospace, SFMono-Regular, monospace; font-size: 13px; }
      .step-hit { fill: #0b9d42; font-family: ui-monospace, SFMono-Regular, monospace; font-size: 13px; font-weight: 700; }
    </style>
  </defs>

  <!-- Row 0 -->
  <rect class="cell-fix" x="30" y="30" width="72" height="48" rx="6"/>
  <text class="pos-lbl-fix" x="38" y="44">0</text>
  <text class="val-bold" x="66" y="58">1</text>

  <rect class="cell" x="110" y="30" width="72" height="48" rx="6"/>
  <text class="pos-lbl" x="118" y="44">1</text>
  <text class="val" x="146" y="58">3</text>

  <rect class="cell" x="190" y="30" width="72" height="48" rx="6"/>
  <text class="pos-lbl" x="198" y="44">2</text>
  <text class="val" x="226" y="58">7</text>

  <rect class="cell" x="270" y="30" width="72" height="48" rx="6"/>
  <text class="pos-lbl" x="278" y="44">3</text>
  <text class="val" x="306" y="58">4</text>

  <!-- Row 1 -->
  <rect class="cell" x="30" y="86" width="72" height="48" rx="6"/>
  <text class="pos-lbl" x="38" y="100">4</text>
  <text class="val" x="66" y="114">8</text>

  <rect class="cell-pair" x="110" y="86" width="72" height="48" rx="6"/>
  <text class="pos-lbl-pair" x="118" y="100">5</text>
  <text class="val-bold" x="146" y="114">5</text>

  <rect class="cell" x="190" y="86" width="72" height="48" rx="6"/>
  <text class="pos-lbl" x="198" y="100">6</text>
  <text class="val" x="226" y="114">2</text>

  <rect class="cell" x="270" y="86" width="72" height="48" rx="6"/>
  <text class="pos-lbl" x="278" y="100">7</text>
  <text class="val" x="306" y="114">6</text>

  <!-- Row 2 -->
  <rect class="cell" x="30" y="142" width="72" height="48" rx="6"/>
  <text class="pos-lbl" x="38" y="156">8</text>
  <text class="val" x="66" y="170">4</text>

  <rect class="cell" x="110" y="142" width="72" height="48" rx="6"/>
  <text class="pos-lbl" x="118" y="156">9</text>
  <text class="val" x="146" y="170">7</text>

  <rect class="cell-pair" x="190" y="142" width="72" height="48" rx="6"/>
  <text class="pos-lbl-pair" x="198" y="156">10</text>
  <text class="val-bold" x="226" y="170">9</text>

  <rect class="cell" x="270" y="142" width="72" height="48" rx="6"/>
  <text class="pos-lbl" x="278" y="156">11</text>
  <text class="val" x="306" y="170">3</text>

  <!-- Right: scan explanation -->
  <text class="step-hdr" x="400" y="44">fix one position</text>
  <text class="step-body" x="400" y="66">pos 0 = 1, need 14 from pair</text>

  <text class="step-hdr" x="400" y="104">hash-scan the rest</text>
  <text class="step-muted" x="400" y="126">pos 5 = 5, store {5 → 5}</text>
  <text class="step-hit" x="400" y="146">pos 10 = 9, need 5 → hit!</text>

  <text class="step-hdr" x="400" y="184">triple (0, 5, 10)</text>

</svg>
