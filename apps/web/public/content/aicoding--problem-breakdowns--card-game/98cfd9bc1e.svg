<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 230" font-family="ui-sans-serif, system-ui, sans-serif">
  <defs>
    <style>
      .cell { fill: #FFFFFF; stroke: #919EAB; stroke-width: 1.5; }
      .pos-lbl { fill: #919EAB; font-family: ui-monospace, SFMono-Regular, monospace; font-size: 10px; }
      .val { fill: #212B36; font-family: ui-monospace, SFMono-Regular, monospace; font-size: 15px; text-anchor: middle; dominant-baseline: central; }
      .probe { fill: #454F5B; font-family: ui-monospace, SFMono-Regular, monospace; font-size: 13px; dominant-baseline: central; }
      .probe-dim { fill: #919EAB; font-family: ui-monospace, SFMono-Regular, monospace; font-size: 13px; dominant-baseline: central; }
      .probe-hit { fill: #0b9d42; font-family: ui-monospace, SFMono-Regular, monospace; font-size: 13px; font-weight: 700; dominant-baseline: central; }
      .mark-miss { fill: #919EAB; font-family: ui-monospace, SFMono-Regular, monospace; font-size: 13px; text-anchor: end; dominant-baseline: central; }
      .mark-hit { fill: #0b9d42; font-family: ui-monospace, SFMono-Regular, monospace; font-size: 13px; font-weight: 700; text-anchor: end; dominant-baseline: central; }
    </style>
  </defs>

  <!-- Row 0 -->
  <rect class="cell" x="30" y="30" width="72" height="48" rx="6"/>
  <text class="pos-lbl" x="38" y="44">0</text>
  <text class="val" x="66" y="58">1</text>

  <rect class="cell" x="110" y="30" width="72" height="48" rx="6"/>
  <text class="pos-lbl" x="118" y="44">1</text>
  <text class="val" x="146" y="58">3</text>

  <rect class="cell" x="190" y="30" width="72" height="48" rx="6"/>
  <text class="pos-lbl" x="198" y="44">2</text>
  <text class="val" x="226" y="58">7</text>

  <rect class="cell" x="270" y="30" width="72" height="48" rx="6"/>
  <text class="pos-lbl" x="278" y="44">3</text>
  <text class="val" x="306" y="58">4</text>

  <!-- Row 1 -->
  <rect class="cell" x="30" y="86" width="72" height="48" rx="6"/>
  <text class="pos-lbl" x="38" y="100">4</text>
  <text class="val" x="66" y="114">8</text>

  <rect class="cell" x="110" y="86" width="72" height="48" rx="6"/>
  <text class="pos-lbl" x="118" y="100">5</text>
  <text class="val" x="146" y="114">5</text>

  <rect class="cell" x="190" y="86" width="72" height="48" rx="6"/>
  <text class="pos-lbl" x="198" y="100">6</text>
  <text class="val" x="226" y="114">2</text>

  <rect class="cell" x="270" y="86" width="72" height="48" rx="6"/>
  <text class="pos-lbl" x="278" y="100">7</text>
  <text class="val" x="306" y="114">6</text>

  <!-- Row 2 -->
  <rect class="cell" x="30" y="142" width="72" height="48" rx="6"/>
  <text class="pos-lbl" x="38" y="156">8</text>
  <text class="val" x="66" y="170">4</text>

  <rect class="cell" x="110" y="142" width="72" height="48" rx="6"/>
  <text class="pos-lbl" x="118" y="156">9</text>
  <text class="val" x="146" y="170">7</text>

  <rect class="cell" x="190" y="142" width="72" height="48" rx="6"/>
  <text class="pos-lbl" x="198" y="156">10</text>
  <text class="val" x="226" y="170">9</text>

  <rect class="cell" x="270" y="142" width="72" height="48" rx="6"/>
  <text class="pos-lbl" x="278" y="156">11</text>
  <text class="val" x="306" y="170">3</text>

  <!-- Right: enumeration probes -->
  <text class="probe" x="400" y="42">(0, 1, 2)   1 + 3 + 7 = 11</text>
  <text class="mark-miss" x="690" y="42">✗</text>

  <text class="probe" x="400" y="70">(0, 1, 3)   1 + 3 + 4 = 8</text>
  <text class="mark-miss" x="690" y="70">✗</text>

  <text class="probe" x="400" y="98">(0, 1, 4)   1 + 3 + 8 = 12</text>
  <text class="mark-miss" x="690" y="98">✗</text>

  <text class="probe-dim" x="400" y="126">...</text>

  <!-- Hit row -->
  <rect x="394" y="156" width="302" height="30" rx="5" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text class="probe-hit" x="400" y="171">(0, 5, 10)   1 + 5 + 9 = 15</text>
  <text class="mark-hit" x="690" y="171">✓</text>

</svg>
