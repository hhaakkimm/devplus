<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 15 740 330" font-family="ui-sans-serif, system-ui, sans-serif">
  <defs>
    <style>
      .edge { stroke: #919EAB; stroke-width: 1.4; fill: none; }
      .node { fill: #FFFFFF; stroke: #919EAB; stroke-width: 1.5; }
      .node-zero { fill: #F1F7F6; stroke: #299a8d; stroke-width: 2.5; }
      .node-text { fill: #212B36; font-family: ui-monospace, SFMono-Regular, monospace; font-size: 13px; font-weight: 700; text-anchor: middle; dominant-baseline: central; }
      .node-text-zero { fill: #227d70; font-family: ui-monospace, SFMono-Regular, monospace; font-size: 13px; font-weight: 700; text-anchor: middle; dominant-baseline: central; }
      .indeg-badge { fill: #FDF8F3; stroke: #f4a261; stroke-width: 1.5; }
      .indeg-badge-zero { fill: #d1fae5; stroke: #059669; stroke-width: 1.5; }
      .indeg-text { fill: #c2410c; font-size: 11px; font-weight: 700; text-anchor: middle; dominant-baseline: central; font-family: ui-monospace, SFMono-Regular, monospace; }
      .indeg-text-zero { fill: #0b9d42; font-size: 11px; font-weight: 700; text-anchor: middle; dominant-baseline: central; font-family: ui-monospace, SFMono-Regular, monospace; }
      .step-row { fill: #454F5B; font-size: 12px; font-family: ui-monospace, SFMono-Regular, monospace; }
      .step-row-hit { fill: #227d70; font-size: 12px; font-weight: 700; font-family: ui-monospace, SFMono-Regular, monospace; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#919EAB"/>
    </marker>
  </defs>

  <!-- ========== Left: DAG ========== -->
  <!-- Layout:
       col0 center x=110  (compile y=80, lint y=200)    midpoint y=140
       col1 center x=230  (test y=110, package y=170)   midpoint y=140
       col2 center x=350  (deploy y=140)                midpoint y=140
       Node rect widths: col0 w=110, col1/col2 w=90
  -->

  <!-- Edges (marker draws arrowhead at endpoint) -->
  <path class="edge" d="M 165,80  L 185,110" marker-end="url(#arrow)"/>
  <path class="edge" d="M 165,80  L 185,170" marker-end="url(#arrow)"/>
  <path class="edge" d="M 165,200 L 185,170" marker-end="url(#arrow)"/>
  <path class="edge" d="M 275,110 L 305,140" marker-end="url(#arrow)"/>
  <path class="edge" d="M 275,170 L 305,140" marker-end="url(#arrow)"/>

  <!-- compile node (in-degree 0) -->
  <rect class="node-zero" x="55" y="55" width="110" height="50" rx="8"/>
  <text class="node-text-zero" x="110" y="72">compile</text>
  <text class="node-text-zero" x="110" y="90" font-size="11" font-weight="400" fill="#637381">3s</text>
  <circle class="indeg-badge-zero" cx="155" cy="62" r="10"/>
  <text class="indeg-text-zero" x="155" y="62">0</text>

  <!-- lint node (in-degree 0) -->
  <rect class="node-zero" x="55" y="175" width="110" height="50" rx="8"/>
  <text class="node-text-zero" x="110" y="192">lint</text>
  <text class="node-text-zero" x="110" y="210" font-size="11" font-weight="400" fill="#637381">1s</text>
  <circle class="indeg-badge-zero" cx="155" cy="182" r="10"/>
  <text class="indeg-text-zero" x="155" y="182">0</text>

  <!-- test node (in-degree 1) -->
  <rect class="node" x="185" y="85" width="90" height="50" rx="8"/>
  <text class="node-text" x="230" y="102">test</text>
  <text class="node-text" x="230" y="120" font-size="11" font-weight="400" fill="#637381">4s</text>
  <circle class="indeg-badge" cx="265" cy="92" r="10"/>
  <text class="indeg-text" x="265" y="92">1</text>

  <!-- package node (in-degree 2) -->
  <rect class="node" x="185" y="145" width="90" height="50" rx="8"/>
  <text class="node-text" x="230" y="162">package</text>
  <text class="node-text" x="230" y="180" font-size="11" font-weight="400" fill="#637381">2s</text>
  <circle class="indeg-badge" cx="265" cy="152" r="10"/>
  <text class="indeg-text" x="265" y="152">2</text>

  <!-- deploy node (in-degree 2) -->
  <rect class="node" x="305" y="115" width="90" height="50" rx="8"/>
  <text class="node-text" x="350" y="132">deploy</text>
  <text class="node-text" x="350" y="150" font-size="11" font-weight="400" fill="#637381">1s</text>
  <circle class="indeg-badge" cx="385" cy="122" r="10"/>
  <text class="indeg-text" x="385" y="122">2</text>

  <!-- ========== Right: queue drain ========== -->
  <rect fill="#F9FAFB" stroke="#DFE3E8" stroke-width="1" x="460" y="42" width="290" height="210" rx="6"/>

  <g transform="translate(474, 66)">
    <text class="step-row-hit" x="0" y="0">1  pop compile</text>
    <text class="step-row" x="0" y="16" fill="#637381">   test 1→0,  package 2→1</text>

    <text class="step-row-hit" x="0" y="42">2  pop lint</text>
    <text class="step-row" x="0" y="58" fill="#637381">   package 1→0</text>

    <text class="step-row-hit" x="0" y="84">3  pop test</text>
    <text class="step-row" x="0" y="100" fill="#637381">   deploy 2→1</text>

    <text class="step-row-hit" x="0" y="126">4  pop package</text>
    <text class="step-row" x="0" y="142" fill="#637381">   deploy 1→0</text>

    <text class="step-row-hit" x="0" y="168">5  pop deploy</text>
  </g>

  <!-- Output row -->
  <g transform="translate(140, 303)" font-family="ui-monospace, SFMono-Regular, monospace">
    <rect fill="#F1F7F6" stroke="#299a8d" stroke-width="1.5" x="0" y="0" width="66" height="24" rx="4"/>
    <text fill="#227d70" font-size="12" font-weight="700" x="33" y="12" text-anchor="middle" dominant-baseline="central">compile</text>
    <rect fill="#F1F7F6" stroke="#299a8d" stroke-width="1.5" x="74" y="0" width="50" height="24" rx="4"/>
    <text fill="#227d70" font-size="12" font-weight="700" x="99" y="12" text-anchor="middle" dominant-baseline="central">lint</text>
    <rect fill="#F1F7F6" stroke="#299a8d" stroke-width="1.5" x="132" y="0" width="50" height="24" rx="4"/>
    <text fill="#227d70" font-size="12" font-weight="700" x="157" y="12" text-anchor="middle" dominant-baseline="central">test</text>
    <rect fill="#F1F7F6" stroke="#299a8d" stroke-width="1.5" x="190" y="0" width="70" height="24" rx="4"/>
    <text fill="#227d70" font-size="12" font-weight="700" x="225" y="12" text-anchor="middle" dominant-baseline="central">package</text>
    <rect fill="#F1F7F6" stroke="#299a8d" stroke-width="1.5" x="268" y="0" width="62" height="24" rx="4"/>
    <text fill="#227d70" font-size="12" font-weight="700" x="299" y="12" text-anchor="middle" dominant-baseline="central">deploy</text>
  </g>
</svg>
