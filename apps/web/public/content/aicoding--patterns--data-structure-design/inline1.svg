<svg xmlns="http://www.w3.org/2000/svg" class="mx-auto block my-8 h-auto w-full max-w-[720px]" viewBox="0 0 720 240" xmlns="http://www.w3.org/2000/svg"><defs><lineargradient id="tealGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" style="stop-color:#59b9b0;stop-opacity:1"></stop><stop offset="100%" style="stop-color:rgb(41, 154, 141);stop-opacity:1"></stop></lineargradient></defs><rect fill="url(#tealGrad)" height="90" opacity="0.9" rx="10" width="210" x="10" y="10"></rect><text fill="white" font-size="15" font-weight="bold" text-anchor="middle" x="115" y="40">HashMap</text><text fill="white" font-size="12" text-anchor="middle" x="115" y="62">O(1) get / set / delete</text><text fill="rgba(255,255,255,0.8)" font-size="11" text-anchor="middle" x="115" y="80">Key-value lookup</text><rect fill="url(#tealGrad)" height="90" opacity="0.9" rx="10" width="210" x="250" y="10"></rect><text fill="white" font-size="15" font-weight="bold" text-anchor="middle" x="355" y="40">Heap / Priority Queue</text><text fill="white" font-size="12" text-anchor="middle" x="355" y="62">O(log n) push / pop</text><text fill="rgba(255,255,255,0.8)" font-size="11" text-anchor="middle" x="355" y="80">Min or max in O(1)</text><rect fill="url(#tealGrad)" height="90" opacity="0.9" rx="10" width="210" x="490" y="10"></rect><text fill="white" font-size="15" font-weight="bold" text-anchor="middle" x="595" y="40">Doubly-Linked List</text><text fill="white" font-size="12" text-anchor="middle" x="595" y="62">O(1) insert / remove</text><text fill="rgba(255,255,255,0.8)" font-size="11" text-anchor="middle" x="595" y="80">With pointer to node</text><rect fill="#195045" height="90" opacity="0.9" rx="10" width="210" x="10" y="130"></rect><text fill="white" font-size="15" font-weight="bold" text-anchor="middle" x="115" y="160">Queue / Deque</text><text fill="white" font-size="12" text-anchor="middle" x="115" y="182">O(1) push / pop ends</text><text fill="rgba(255,255,255,0.8)" font-size="11" text-anchor="middle" x="115" y="200">FIFO / double-ended</text><rect fill="#195045" height="90" opacity="0.9" rx="10" width="210" x="250" y="130"></rect><text fill="white" font-size="15" font-weight="bold" text-anchor="middle" x="355" y="160">Balanced BST / SortedSet</text><text fill="white" font-size="12" text-anchor="middle" x="355" y="182">O(log n) all ops</text><text fill="rgba(255,255,255,0.8)" font-size="11" text-anchor="middle" x="355" y="200">Ordered iteration</text><rect fill="#195045" height="90" opacity="0.9" rx="10" width="210" x="490" y="130"></rect><text fill="white" font-size="15" font-weight="bold" text-anchor="middle" x="595" y="160">Union-Find</text><text fill="white" font-size="12" text-anchor="middle" x="595" y="182">~O(1) union / find</text><text fill="rgba(255,255,255,0.8)" font-size="11" text-anchor="middle" x="595" y="200">Connected components</text></svg>