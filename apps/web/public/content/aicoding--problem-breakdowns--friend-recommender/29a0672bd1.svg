<svg xmlns="http://www.w3.org/2000/svg" viewBox="30 20 660 210" font-family="ui-sans-serif, system-ui, sans-serif">
  <defs>
    <style>
      .user-box { fill: #F1F7F6; stroke: #299a8d; stroke-width: 2.5; }
      .user-label { fill: #227d70; font-family: ui-monospace, SFMono-Regular, monospace; font-size: 15px; font-weight: 700; text-anchor: middle; dominant-baseline: central; }
      .cand-box { fill: #FFFFFF; stroke: #C4CDD5; stroke-width: 1.3; }
      .cand-box-hit { fill: #d1fae5; stroke: #059669; stroke-width: 2.5; }
      .cand-text { fill: #637381; font-family: ui-monospace, SFMono-Regular, monospace; font-size: 13px; text-anchor: middle; dominant-baseline: central; }
      .cand-text-hit { fill: #0b9d42; font-family: ui-monospace, SFMono-Regular, monospace; font-size: 13px; font-weight: 700; text-anchor: middle; dominant-baseline: central; }
      .scan-edge { stroke: #919EAB; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
      .section-lbl { fill: #454F5B; font-size: 13px; font-weight: 600; text-anchor: middle; }
      .ann-reject { fill: #919EAB; font-size: 11px; text-anchor: middle; }
      .ann-hit { fill: #0b9d42; font-size: 12px; font-weight: 700; text-anchor: middle; }
    </style>
  </defs>

  <!-- top label -->
  <text class="section-lbl" x="80" y="36">user</text>
  <text class="section-lbl" x="440" y="36">candidates</text>

  <!-- scan edges drawn first (behind boxes) -->
  <g>
    <path class="scan-edge" d="M 130,100 L 215,100"/>
    <path class="scan-edge" d="M 130,100 L 285,100"/>
    <path class="scan-edge" d="M 130,100 L 355,100"/>
    <path class="scan-edge" d="M 130,100 L 425,100"/>
    <path class="scan-edge" d="M 130,100 L 495,100"/>
    <path class="scan-edge" d="M 130,100 L 565,100"/>
    <path class="scan-edge" d="M 130,100 L 635,100"/>
  </g>

  <!-- user node -->
  <rect class="user-box" x="50" y="75" width="80" height="50" rx="8"/>
  <text class="user-label" x="90" y="100">Alice</text>

  <!-- candidate row -->
  <g>
    <rect class="cand-box" x="185" y="75" width="60" height="50" rx="6"/>
    <text class="cand-text" x="215" y="100">Ivan</text>

    <rect class="cand-box-hit" x="255" y="75" width="60" height="50" rx="6"/>
    <text class="cand-text-hit" x="285" y="100">Eve</text>

    <rect class="cand-box" x="325" y="75" width="60" height="50" rx="6"/>
    <text class="cand-text" x="355" y="100">Maya</text>

    <rect class="cand-box-hit" x="395" y="75" width="60" height="50" rx="6"/>
    <text class="cand-text-hit" x="425" y="100">Frank</text>

    <rect class="cand-box" x="465" y="75" width="60" height="50" rx="6"/>
    <text class="cand-text" x="495" y="100">Oscar</text>

    <rect class="cand-box-hit" x="535" y="75" width="60" height="50" rx="6"/>
    <text class="cand-text-hit" x="565" y="100">Grace</text>

    <rect class="cand-box" x="605" y="75" width="60" height="50" rx="6"/>
    <text class="cand-text" x="635" y="100">Peter</text>
  </g>

  <!-- annotations below -->
  <g>
    <text class="ann-reject" x="215" y="148">0 mutuals</text>
    <text class="ann-hit" x="285" y="148">2 mutuals</text>
    <text class="ann-reject" x="355" y="148">0 mutuals</text>
    <text class="ann-hit" x="425" y="148">2 mutuals</text>
    <text class="ann-reject" x="495" y="148">0 mutuals</text>
    <text class="ann-hit" x="565" y="148">1 mutual</text>
    <text class="ann-reject" x="635" y="148">0 mutuals</text>
  </g>

  <!-- ellipsis indicating many more -->
  <text class="section-lbl" x="425" y="215" style="font-size: 16px; letter-spacing: 4px;">. . .</text>
</svg>
