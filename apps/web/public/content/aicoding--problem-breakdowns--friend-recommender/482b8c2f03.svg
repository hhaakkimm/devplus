<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 510" font-family="ui-sans-serif, system-ui, sans-serif">
  <defs>
    <style>
      .node-query  { fill: #F1F7F6; stroke: #299a8d; stroke-width: 3; }
      .node-friend { fill: #F1F7F6; stroke: #299a8d; stroke-width: 2; }
      .node-hit    { fill: #d1fae5; stroke: #059669; stroke-width: 2.8; }
      .node-text   { fill: #212B36; font-family: ui-monospace, SFMono-Regular, monospace; font-size: 12px; font-weight: 600; text-anchor: middle; dominant-baseline: central; }
      .node-text-hit { fill: #0b9d42; font-family: ui-monospace, SFMono-Regular, monospace; font-size: 12px; font-weight: 700; text-anchor: middle; dominant-baseline: central; }
      .edge        { stroke: #919EAB; stroke-width: 1.4; fill: none; }
      .mutual-ann  { fill: #919EAB; font-size: 11px; text-anchor: start; dominant-baseline: central; }
    </style>
  </defs>

  <!-- Node centers:
       Alice   (260, 220)  query user
       Bob     (140, 110)  direct friend
       Chris   (420, 155)  direct friend
       Diana   (175, 365)  direct friend
       Eve     (530,  75)  recommendation (2 mutuals)
       Frank   (540, 360)  recommendation (2 mutuals)
       Grace   (355, 465)  recommendation (1 mutual)
  -->

  <!-- ── Edges first ── -->

  <!-- Alice to direct friends -->
  <path class="edge" d="M 260,220 L 140,110"/>
  <path class="edge" d="M 260,220 L 420,155"/>
  <path class="edge" d="M 260,220 L 175,365"/>

  <!-- Bob–Chris -->
  <path class="edge" d="M 140,110 L 420,155"/>

  <!-- Bob–Eve -->
  <path class="edge" d="M 140,110 L 530,75"/>

  <!-- Chris–Diana -->
  <path class="edge" d="M 420,155 L 175,365"/>

  <!-- Chris–Eve -->
  <path class="edge" d="M 420,155 L 530,75"/>

  <!-- Chris–Frank -->
  <path class="edge" d="M 420,155 L 540,360"/>

  <!-- Diana–Frank -->
  <path class="edge" d="M 175,365 L 540,360"/>

  <!-- Diana–Grace -->
  <path class="edge" d="M 175,365 L 355,465"/>

  <!-- ── Nodes on top ── -->

  <!-- Alice (query user, r=28) -->
  <circle class="node-query" cx="260" cy="220" r="28"/>
  <text class="node-text" x="260" y="220">Alice</text>

  <!-- Direct friends (r=24) -->
  <circle class="node-friend" cx="140" cy="110" r="24"/>
  <text class="node-text" x="140" y="110">Bob</text>

  <circle class="node-friend" cx="420" cy="155" r="24"/>
  <text class="node-text" x="420" y="155">Chris</text>

  <circle class="node-friend" cx="175" cy="365" r="24"/>
  <text class="node-text" x="175" y="365">Diana</text>

  <!-- Recommendations (r=22) -->
  <circle class="node-hit" cx="530" cy="75" r="22"/>
  <text class="node-text-hit" x="530" y="75">Eve</text>

  <circle class="node-hit" cx="540" cy="360" r="22"/>
  <text class="node-text-hit" x="540" y="360">Frank</text>

  <circle class="node-hit" cx="355" cy="465" r="22"/>
  <text class="node-text-hit" x="355" y="465">Grace</text>

  <!-- Mutual-count annotations next to recommendation nodes -->
  <text class="mutual-ann" x="557" y="75">2 mutuals</text>
  <text class="mutual-ann" x="567" y="360">2 mutuals</text>
  <text class="mutual-ann" x="381" y="465">1 mutual</text>

</svg>
