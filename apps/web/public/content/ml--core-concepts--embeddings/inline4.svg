<svg xmlns="http://www.w3.org/2000/svg" aria-label="Contrastive learning: training pulls positive pairs together in the embedding space and pushes negative pairs apart" class="emb" role="img" style="display:block;margin:1.5rem auto;max-width:100%;height:auto" viewBox="0 0 720 360" xmlns="http://www.w3.org/2000/svg"><defs><marker id="cl-ah-p" markerheight="6" markerwidth="6" orient="auto-start-reverse" refx="9" refy="5" viewBox="0 0 10 10"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0b9d42"></path></marker><marker id="cl-ah-n" markerheight="6" markerwidth="6" orient="auto-start-reverse" refx="9" refy="5" viewBox="0 0 10 10"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e76f51"></path></marker><marker id="cl-ah-t" markerheight="6" markerwidth="6" orient="auto-start-reverse" refx="9" refy="5" viewBox="0 0 10 10"><path d="M 0 0 L 10 5 L 0 10 z" fill="#299a8d"></path></marker></defs><g transform="translate(40,30)"><text class="title" text-anchor="middle" x="130" y="0">Before training</text><text class="note" text-anchor="middle" x="130" y="16">anchor, positive, negative are all mixed</text><rect class="space" height="220" rx="6" width="260" x="0" y="30"></rect><circle class="dot-a" cx="130" cy="140" r="7"></circle><text class="tag-a" x="140" y="137">a</text><circle class="dot-p" cx="70" cy="200" r="6"></circle><text class="tag-p" x="58" y="218">p</text><circle class="dot-n" cx="90" cy="80" r="6"></circle><text class="tag-n" x="78" y="76">n</text><text class="sub" text-anchor="middle" x="130" y="272">random initialization</text></g><g transform="translate(330,140)"><path class="train" d="M 0 10 L 60 10" marker-end="url(#cl-ah-t)"></path><text class="sub" text-anchor="middle" x="30" y="0">train</text><text class="note" text-anchor="middle" x="30" y="28">via triplet or</text><text class="note" text-anchor="middle" x="30" y="42">InfoNCE loss</text></g><g transform="translate(420,30)"><text class="title" text-anchor="middle" x="130" y="0">After training</text><text class="note" text-anchor="middle" x="130" y="16">positive pulled in, negative pushed out</text><rect class="space" height="220" rx="6" width="260" x="0" y="30"></rect><circle class="dot-a" cx="130" cy="140" r="7"></circle><text class="tag-a" x="140" y="137">a</text><circle class="ghost-p" cx="70" cy="200" r="6"></circle><path class="trail" d="M 70 200 L 148 156"></path><path class="pull" d="M 78 194 L 144 154" marker-end="url(#cl-ah-p)"></path><circle class="dot-p" cx="150" cy="152" r="6"></circle><text class="tag-p" x="158" y="148">p</text><circle class="ghost-n" cx="90" cy="80" r="6"></circle><path class="trail" d="M 90 80 L 38 52"></path><path class="push" d="M 84 78 L 42 54" marker-end="url(#cl-ah-n)"></path><circle class="dot-n" cx="36" cy="50" r="6"></circle><text class="tag-n" x="24" y="44">n</text><text class="sub" text-anchor="middle" x="130" y="272">positives close, negatives far</text></g><g transform="translate(40,334)"><circle class="dot-a" cx="8" cy="8" r="5"></circle><text class="sub" x="20" y="12">a = anchor</text><circle class="dot-p" cx="108" cy="8" r="5"></circle><text class="sub" x="120" y="12">p = positive (similar to a)</text><circle class="dot-n" cx="300" cy="8" r="5"></circle><text class="sub" x="312" y="12">n = negative (dissimilar to a)</text></g></svg>