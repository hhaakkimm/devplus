<svg xmlns="http://www.w3.org/2000/svg" aria-label="Pre-trained plus fine-tuning: a large encoder is pre-trained on a massive general corpus, then its weights are reused with only a small task-specific head trained on your smaller task data" class="emb" role="img" style="display:block;margin:1.5rem auto;max-width:100%;height:auto" viewBox="0 0 720 380" xmlns="http://www.w3.org/2000/svg"><defs><marker id="pt-ah" markerheight="7" markerwidth="7" orient="auto-start-reverse" refx="9" refy="5" viewBox="0 0 10 10"><path d="M 0 0 L 10 5 L 0 10 z" fill="#919EAB"></path></marker><marker id="pt-ah-reuse" markerheight="7" markerwidth="7" orient="auto-start-reverse" refx="9" refy="5" viewBox="0 0 10 10"><path d="M 0 0 L 10 5 L 0 10 z" fill="#299a8d"></path></marker></defs><g transform="translate(40,40)"><rect class="phase" height="280" rx="10" width="280" x="-10" y="-10"></rect><text class="title" text-anchor="middle" x="130" y="8">Phase 1: Pre-training</text><text class="note" text-anchor="middle" x="130" y="26">done once, by someone else, on lots of GPUs</text><rect class="data-big" height="38" rx="4" width="200" x="30" y="46"></rect><text class="sub" text-anchor="middle" x="130" y="70">massive general corpus</text><text class="note" text-anchor="middle" x="130" y="104">(billions of tokens or images)</text><path class="arrow" d="M 130 114 L 130 130" marker-end="url(#pt-ah)"></path><rect class="trained" height="28" rx="4" width="160" x="50" y="136"></rect><text class="sub" text-anchor="middle" x="130" y="155">encoder layer</text><rect class="trained" height="28" rx="4" width="160" x="50" y="170"></rect><text class="sub" text-anchor="middle" x="130" y="189">encoder layer</text><rect class="trained" height="28" rx="4" width="160" x="50" y="204"></rect><text class="sub" text-anchor="middle" x="130" y="223">encoder layer</text><text class="note" text-anchor="middle" x="130" y="256">all weights learned</text></g><g transform="translate(330,160)"><path d="M 0 10 L 60 10" fill="none" marker-end="url(#pt-ah-reuse)" stroke="#299a8d" stroke-width="2"></path><text class="sub" text-anchor="middle" x="30" y="0">reuse</text><text class="note" text-anchor="middle" x="30" y="26">encoder</text><text class="note" text-anchor="middle" x="30" y="40">weights</text></g><g transform="translate(420,40)"><rect class="phase" height="280" rx="10" width="280" x="-10" y="-10"></rect><text class="title" text-anchor="middle" x="130" y="8">Phase 2: Fine-tuning</text><text class="note" text-anchor="middle" x="130" y="26">done by you, on your task data</text><rect class="data-small" height="38" rx="4" width="140" x="60" y="46"></rect><text class="sub" text-anchor="middle" x="130" y="70">your task data</text><text class="note" text-anchor="middle" x="130" y="104">(thousands of labeled examples)</text><path class="arrow" d="M 130 114 L 130 130" marker-end="url(#pt-ah)"></path><rect class="trained" height="28" rx="4" width="160" x="50" y="136"></rect><text class="sub" text-anchor="middle" x="130" y="155">task head (trained)</text><rect class="frozen" height="28" rx="4" width="160" x="50" y="170"></rect><text class="sub" text-anchor="middle" x="130" y="189">encoder layer (frozen)</text><rect class="frozen" height="28" rx="4" width="160" x="50" y="204"></rect><text class="sub" text-anchor="middle" x="130" y="223">encoder layer (frozen)</text><text class="note" text-anchor="middle" x="130" y="256">small head trained, encoder mostly fixed</text></g><g transform="translate(40,350)"><rect class="trained" height="14" rx="2" width="18" x="0" y="0"></rect><text class="sub" x="24" y="12">trainable in this phase</text><rect class="frozen" height="14" rx="2" width="18" x="180" y="0"></rect><text class="sub" x="204" y="12">frozen (reused)</text><rect class="data-big" height="14" rx="2" width="18" x="320" y="0"></rect><text class="sub" x="344" y="12">large general data</text><rect class="data-small" height="14" rx="2" width="18" x="480" y="0"></rect><text class="sub" x="504" y="12">small task data</text></g></svg>