<svg xmlns="http://www.w3.org/2000/svg" aria-label="Two-tower architecture: a query encoder and a candidate encoder produce embeddings in the same vector space, and their dot product is trained to be high for positive pairs and low for negative pairs" class="emb" role="img" style="display:block;margin:1.5rem auto;max-width:100%;height:auto" viewBox="0 0 720 300" xmlns="http://www.w3.org/2000/svg"><defs><marker id="tt-ah" markerheight="7" markerwidth="7" orient="auto-start-reverse" refx="9" refy="5" viewBox="0 0 10 10"><path d="M 0 0 L 10 5 L 0 10 z" fill="#919EAB"></path></marker></defs><g transform="translate(80,40)"><text class="title" text-anchor="middle" x="90" y="0">Query Tower</text><text class="note" text-anchor="middle" x="90" y="16">(user, query)</text><rect class="input" height="38" rx="4" width="140" x="20" y="220"></rect><text class="sub" text-anchor="middle" x="90" y="244">user features</text><rect class="layer" height="36" rx="4" width="100" x="40" y="170"></rect><text class="sub" text-anchor="middle" x="90" y="192">dense layer</text><rect class="layer" height="36" rx="4" width="100" x="40" y="124"></rect><text class="sub" text-anchor="middle" x="90" y="146">dense layer</text><rect class="emb-box" height="36" rx="4" width="140" x="20" y="76"></rect><text class="vec" text-anchor="middle" x="90" y="99">u   (query embedding)</text><path class="arrow" d="M 90 218 L 90 208" marker-end="url(#tt-ah)"></path><path class="arrow" d="M 90 168 L 90 162" marker-end="url(#tt-ah)"></path><path class="arrow" d="M 90 122 L 90 114" marker-end="url(#tt-ah)"></path></g><g transform="translate(460,40)"><text class="title" text-anchor="middle" x="90" y="0">Candidate Tower</text><text class="note" text-anchor="middle" x="90" y="16">(item, document)</text><rect class="input" height="38" rx="4" width="140" x="20" y="220"></rect><text class="sub" text-anchor="middle" x="90" y="244">item features</text><rect class="layer" height="36" rx="4" width="100" x="40" y="170"></rect><text class="sub" text-anchor="middle" x="90" y="192">dense layer</text><rect class="layer" height="36" rx="4" width="100" x="40" y="124"></rect><text class="sub" text-anchor="middle" x="90" y="146">dense layer</text><rect class="emb-box" height="36" rx="4" width="140" x="20" y="76"></rect><text class="vec" text-anchor="middle" x="90" y="99">v   (item embedding)</text><path class="arrow" d="M 90 218 L 90 208" marker-end="url(#tt-ah)"></path><path class="arrow" d="M 90 168 L 90 162" marker-end="url(#tt-ah)"></path><path class="arrow" d="M 90 122 L 90 114" marker-end="url(#tt-ah)"></path></g><rect class="sim" height="44" rx="8" width="140" x="290" y="70"></rect><text class="title" text-anchor="middle" x="360" y="90">sim(u, v)</text><text class="note" text-anchor="middle" x="360" y="106">dot product / cosine</text><path class="arrow" d="M 240 114 Q 260 100 290 92" marker-end="url(#tt-ah)"></path><path class="arrow" d="M 620 114 Q 600 100 430 92" marker-end="url(#tt-ah)"></path></svg>