<svg xmlns="http://www.w3.org/2000/svg" viewBox="60 0 440 260" font-family="ui-sans-serif, system-ui, sans-serif">
  <defs>
    <style>
      .arrow-valid { stroke: #059669; stroke-width: 2.6; fill: none; stroke-linecap: round; }
      .arrow-invalid { stroke: #919EAB; stroke-width: 2.2; fill: none; stroke-linecap: round; stroke-dasharray: 5 4; }
      .cell-directional { fill: #FDF8F3; stroke: #f4a261; stroke-width: 2.5; }
      .cell-text { fill: #c2410c; font-family: ui-monospace, SFMono-Regular, monospace; font-size: 26px; font-weight: 700; text-anchor: middle; dominant-baseline: central; }
      .badge-valid { fill: #059669; }
      .badge-invalid { fill: #919EAB; }
      .badge-text { fill: #FFFFFF; font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px; font-weight: 700; text-anchor: middle; dominant-baseline: central; }
      .dir-lbl { fill: #454F5B; font-size: 12px; font-weight: 600; font-family: ui-monospace, SFMono-Regular, monospace; text-anchor: middle; }
      .dir-lbl-good { fill: #059669; font-size: 12px; font-weight: 700; font-family: ui-monospace, SFMono-Regular, monospace; text-anchor: middle; }
    </style>
  </defs>

  <!--
    Central '>' cell at (260, 130), 64x64.
    Four approach arrows, one per cardinal direction.
    Only the left-entering arrow is green/valid; the other three are slate/invalid.
  -->

  <!-- valid: from left arrow -->
  <path class="arrow-valid" d="M 100,130 L 220,130"/>
  <polygon points="228,130 218,125 218,135" fill="#059669"/>
  <circle class="badge-valid" cx="160" cy="110" r="11"/>
  <text class="badge-text" x="160" y="110">✓</text>
  <text class="dir-lbl-good" x="160" y="156">from left</text>

  <!-- invalid: from right -->
  <path class="arrow-invalid" d="M 420,130 L 300,130"/>
  <polygon points="292,130 302,125 302,135" fill="#919EAB"/>
  <circle class="badge-invalid" cx="360" cy="110" r="11"/>
  <text class="badge-text" x="360" y="110">×</text>
  <text class="dir-lbl" x="360" y="156">from right</text>

  <!-- invalid: from above -->
  <path class="arrow-invalid" d="M 260,30 L 260,90"/>
  <polygon points="260,98 255,88 265,88" fill="#919EAB"/>
  <circle class="badge-invalid" cx="292" cy="60" r="11"/>
  <text class="badge-text" x="292" y="60">×</text>
  <text class="dir-lbl" x="260" y="22">from above</text>

  <!-- invalid: from below -->
  <path class="arrow-invalid" d="M 260,230 L 260,170"/>
  <polygon points="260,162 255,172 265,172" fill="#919EAB"/>
  <circle class="badge-invalid" cx="292" cy="200" r="11"/>
  <text class="badge-text" x="292" y="200">×</text>
  <text class="dir-lbl" x="260" y="248">from below</text>

  <!-- central cell on top, covering arrow ends neatly -->
  <rect class="cell-directional" x="228" y="98" width="64" height="64" rx="6"/>
  <text class="cell-text" x="260" y="132">&gt;</text>
</svg>
