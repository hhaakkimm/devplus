[project]
name = "devplus-api"
version = "0.1.0"
description = "devplus API"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "anthropic>=1.15.0",
    "asyncpg>=0.32.0",
    "dishka>=1.10.1",
    "fastapi>=0.143.3",
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "pydantic-settings>=2.16.0",
    "pyyaml>=6.0.3",
    "regex>=2026.9.29",
    "sqlalchemy[asyncio]>=2.1.5",
    "taskiq>=0.13.0",
    "taskiq-redis>=1.2.4",
    "uvicorn[standard]>=0.54.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["app"]

[tool.importlinter]
root_package = "app"

# progress may use auth only through auth.service (CurrentUser); any other auth module is forbidden
[[tool.importlinter.contracts]]
name = "progress uses auth only through its service"
type = "forbidden"
source_modules = ["app.modules.progress"]
forbidden_modules = ["app.modules.auth"]
ignore_imports = ["app.modules.progress.* -> app.modules.auth.service"]

[[tool.importlinter.contracts]]
name = "auth does not depend on progress"
type = "forbidden"
source_modules = ["app.modules.auth"]
forbidden_modules = ["app.modules.progress"]

# evals may use auth only through auth.service (CurrentUser)
[[tool.importlinter.contracts]]
name = "evals uses auth only through its service"
type = "forbidden"
source_modules = ["app.modules.evals"]
forbidden_modules = ["app.modules.auth"]
ignore_imports = ["app.modules.evals.* -> app.modules.auth.service"]

[[tool.importlinter.contracts]]
name = "auth and progress do not depend on evals"
type = "forbidden"
source_modules = ["app.modules.auth", "app.modules.progress"]
forbidden_modules = ["app.modules.evals"]

# review may use auth and evals only through their services
[[tool.importlinter.contracts]]
name = "review uses auth and evals only through their services"
type = "forbidden"
source_modules = ["app.modules.review"]
forbidden_modules = ["app.modules.auth", "app.modules.evals"]
ignore_imports = [
    "app.modules.review.* -> app.modules.auth.service",
    "app.modules.review.* -> app.modules.evals.service",
]

[[tool.importlinter.contracts]]
name = "auth, progress and evals do not depend on review"
type = "forbidden"
source_modules = ["app.modules.auth", "app.modules.progress", "app.modules.evals"]
forbidden_modules = ["app.modules.review"]

# trainer may use auth and evals only through their services, and no other module
[[tool.importlinter.contracts]]
name = "trainer uses auth and evals only through their services"
type = "forbidden"
source_modules = ["app.modules.trainer"]
forbidden_modules = [
    "app.modules.auth",
    "app.modules.evals",
    "app.modules.progress",
    "app.modules.review",
]
ignore_imports = [
    "app.modules.trainer.* -> app.modules.auth.service",
    "app.modules.trainer.* -> app.modules.evals.service",
]

[[tool.importlinter.contracts]]
name = "auth, progress, evals and review do not depend on trainer"
type = "forbidden"
source_modules = [
    "app.modules.auth",
    "app.modules.progress",
    "app.modules.evals",
    "app.modules.review",
]
forbidden_modules = ["app.modules.trainer"]

# code_review may use auth and evals only through their services, and no other module
[[tool.importlinter.contracts]]
name = "code_review uses auth and evals only through their services"
type = "forbidden"
source_modules = ["app.modules.code_review"]
forbidden_modules = [
    "app.modules.auth",
    "app.modules.evals",
    "app.modules.progress",
    "app.modules.review",
    "app.modules.trainer",
]
ignore_imports = [
    "app.modules.code_review.* -> app.modules.auth.service",
    "app.modules.code_review.* -> app.modules.evals.service",
]
# shortcut: nothing in code_review imports auth.service yet, drop this once the router does
unmatched_ignore_imports_alerting = "none"

[[tool.importlinter.contracts]]
name = "auth, progress, evals, review and trainer do not depend on code_review"
type = "forbidden"
source_modules = [
    "app.modules.auth",
    "app.modules.progress",
    "app.modules.evals",
    "app.modules.review",
    "app.modules.trainer",
]
forbidden_modules = ["app.modules.code_review"]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "import-linter>=2.15",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
    "types-jsonschema>=4.26.0.20261006",
    "types-pyyaml>=6.0.12.20260906",
    "types-regex>=2026.9.29.20261017",
]
