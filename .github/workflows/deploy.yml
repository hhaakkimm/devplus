name: Deploy

# Runs after CI is green on a push to main. Skipped until the repository variable VPS_HOST is set (docs/deploy.md).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      vars.VPS_HOST != ''
    runs-on: ubuntu-latest
    # VPS_SSH_KEY lives in this environment, restricted to main (docs/deploy.md).
    environment: production
    # One deploy at a time; a running deploy is never cancelled halfway.
    concurrency:
      group: deploy
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: apps/api
          push: true
          tags: ghcr.io/hhaakkimm/devplus-api:${{ github.event.workflow_run.head_sha }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ghcr.io/hhaakkimm/devplus-web:${{ github.event.workflow_run.head_sha }}
      - name: Ship config and restart the stack
        env:
          TAG: ${{ github.event.workflow_run.head_sha }}
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          TARGET: ${{ vars.VPS_USER }}@${{ vars.VPS_HOST }}
        run: |
          key=$(mktemp)
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$SSH_KEY" > "$key"
          opts=(-i "$key" -o StrictHostKeyChecking=accept-new)
          scp "${opts[@]}" infra/docker-compose.yml infra/Caddyfile "$TARGET:/opt/devplus/"
          # SC2029: $TAG is meant to expand here, on the runner
          # shellcheck disable=SC2029
          ssh "${opts[@]}" "$TARGET" "cd /opt/devplus && echo IMAGE_TAG=$TAG > .env && docker compose pull && docker compose up -d --wait"
