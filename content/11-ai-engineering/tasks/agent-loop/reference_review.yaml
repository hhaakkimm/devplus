verdict: request_changes
comments:
  - file: agent.py
    line_start: 18
    line_end: 18
    text: >-
      Цикл без предела: если модель зациклится на вызовах инструментов, запрос не завершится, а токены будут
      расходоваться, причём с каждым шагом на всё большей истории. Нужен `for step in range(MAX_STEPS)` (и,
      по возможности, бюджет токенов или таймаут на запрос), а при исчерпании лимита вернуть явную ошибку
      и залогировать, на каком вопросе это случилось.
  - file: agent.py
    line_start: 25
    line_end: 25
    text: >-
      Исключение инструмента (нет файла, путь вне папки, неизвестное имя инструмента, неверные аргументы)
      пробьёт цикл и уронит весь запрос, а в истории останется вызов без ответа. Оберни вызов в try/except,
      залогируй и верни модели текст ошибки в tool-сообщении с тем же `tool_call_id`, чтобы она могла
      поправиться. Проглатывать молча тоже нельзя.
  - file: tools.py
    line_start: 35
    line_end: 37
    text: >-
      Команда сгенерирована моделью и выполняется через `shell=True` без ограничений, да ещё с полным окружением,
      где лежит `LLM_API_KEY`. Достаточно prompt injection из прочитанного файла, чтобы получить удаление файлов
      или утечку секретов. Нужны allowlist команд и `subprocess.run([...])` без shell, песочница без секретов
      или подтверждение человеком; плюс `timeout`, иначе зависшая команда повисит вечно.
  - file: memory.py
    line_start: 28
    line_end: 29
    text: >-
      Вывод инструмента попадает в историю целиком и навсегда, а вся история уходит модели на каждом шаге.
      Один `read_file` большого файла или `cat` лога раздувает контекст на десятки тысяч токенов: растёт цена,
      затем упрёмся в окно. Обрезай вывод (с пометкой "обрезано") и ограничь историю скользящим окном или
      суммаризацией.
  - file: llm.py
    line_start: 53
    line_end: 58
    text: >-
      Пять повторов подряд без паузы и на любое исключение: при перегрузке шлюза мы его добиваем, а ошибки вроде
      неверного ключа или ошибки разбора ответа повторять бессмысленно. Нужны экспоненциальная пауза с джиттером
      и повтор только временных ошибок (таймаут, 429, 5xx).
