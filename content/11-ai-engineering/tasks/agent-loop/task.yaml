title: Цикл LLM-агента с инструментами
difficulty: hard
order: 10
estimate_min: 25
threshold: 0.7
issues:
  - id: no-step-limit
    file: agent.py
    lines: [18, 18]
    critical: true
    weight: 3
    description: >-
      Цикл `while True` выходит только когда модель сама перестала вызывать инструменты. Если она зациклится
      (повторяет один и тот же вызов, не может справиться с ошибкой, получает противоречивый результат),
      запрос не завершится никогда: процесс висит, а каждый шаг оплачивается токенами, причём вся растущая
      история отправляется заново. Ночной зависший запрос превращается в счёт и в занятый воркер.
    notes: >-
      Хорошее замечание называет отсутствие предела числа шагов (например, `for step in range(MAX_STEPS)`)
      и желательно того, что делать при его исчерпании: вернуть понятную ошибку или частичный ответ, залогировать.
      Допустимо дополнительно предложить бюджет токенов или общий таймаут по времени. Достаточно любого явного
      ограничителя; одно "добавить логирование" или "поставить sleep" не считается.
  - id: tool-error-unhandled
    file: agent.py
    lines: [25, 25]
    critical: true
    weight: 3
    description: >-
      Вызов инструмента не обёрнут в обработку ошибок. Любое исключение (файл не найден, путь вне рабочей папки,
      ошибка выполнения команды, неизвестное имя инструмента от модели, неверные аргументы в `**call.arguments`) пробивает
      цикл и роняет весь запрос вместе с накопленной историей. Правильное поведение: поймать ошибку, вернуть её
      модели текстом в `tool`-сообщении (с тем же `tool_call_id`), чтобы она могла поправиться, и не оставлять
      вызов без ответа.
    notes: >-
      Хорошее замечание говорит, что исключение инструмента не должно убивать цикл и что текст ошибки нужно
      вернуть модели как результат вызова. Бонус: упомянуть `KeyError` для неизвестного инструмента или неверные
      аргументы, а также что после падения в истории остаётся assistant-сообщение с вызовом без ответа
      (следующий запрос к API может быть отклонён). Замечание "ловить `Exception` и молча проглотить" само
      является ошибкой: ошибка должна дойти до модели и до логов. Замечание можно привязать и к `read_file`,
      если оно говорит про обработку в цикле.
  - id: shell-unsandboxed
    file: tools.py
    lines: [35, 37]
    critical: true
    weight: 3
    description: >-
      Инструмент `run_shell` выполняет строку, сгенерированную моделью, через `shell=True` без ограничений:
      без списка разрешённых команд, без таймаута, с полным окружением процесса (включая `LLM_API_KEY`).
      Модель, на которую повлиял текст из прочитанного файла или вопроса (prompt injection), может удалить файлы,
      вынести секреты по сети или запустить команду, которая не завершится. Ограничение `cwd` защитой не является.
    notes: >-
      Хорошее замечание называет произвольное выполнение команд от имени модели и prompt injection как путь атаки,
      и предлагает хотя бы одно из: allowlist команд без `shell=True` (`subprocess.run([...])`), песочницу или
      контейнер без секретов, подтверждение человеком для опасных команд. Таймаут `subprocess.run(timeout=...)`
      стоит упомянуть, но сам по себе он не закрывает проблему безопасности. Достаточно предложить убрать
      инструмент, если он не нужен для задачи.
  - id: unbounded-context
    file: memory.py
    lines: [28, 29]
    weight: 2
    description: >-
      Результат инструмента кладётся в историю целиком и без ограничения, а история никогда не обрезается и целиком
      отправляется модели на каждом шаге. `read_file` на большом файле или `run_shell` с длинным выводом (`cat`
      лога) за один шаг добавляет десятки тысяч токенов; история же живёт весь сеанс консоли. В итоге запросы
      дорожают квадратично, упираются в окно контекста модели и падают, а полезные ранние сообщения вытесняются.
    notes: >-
      Хорошее замечание предлагает обрезать вывод инструмента (с пометкой, что он обрезан) и/или ограничить
      историю (скользящее окно, суммаризация). Достаточно одного из двух, если названа причина (стоимость, окно
      контекста). Привязка к `read_file` или к месту, где история отправляется в `complete`, тоже допустима.
  - id: retry-no-backoff
    file: llm.py
    lines: [53, 58]
    weight: 1
    description: >-
      Клиент повторяет запрос пять раз подряд без паузы и на любую ошибку. При перегрузке шлюза это добивает
      его пачкой мгновенных повторов от каждого клиента, а ошибки, которые повтор не исправит (неверный ключ,
      неправильный запрос, баг разбора ответа), сжигают те же пять попыток. Нужны экспоненциальная пауза с
      джиттером и повтор только временных ошибок (таймаут, 429, 5xx).
    notes: >-
      Хорошее замечание называет отсутствие паузы между повторами и/или повтор на любое исключение. Достаточно
      одного из двух аспектов; полный ответ называет оба. Широкий `except Exception` сам по себе без связи с
      повторами не засчитывается.
traps:
  - file: config.py
    lines: [19, 22]
    why_fine: >-
      `os.environ["LLM_API_KEY"]` без значения по умолчанию намеренно падает с `KeyError` при старте, если ключ
      не задан. Это fail fast на границе конфигурации, а не необработанная ошибка: лучше упасть сразу при запуске
      сервиса, чем на первом вопросе пользователя или с пустым ключом.
  - file: main.py
    lines: [15, 18]
    why_fine: >-
      `while True` с `input()` и `break` по команде `exit`/`quit` ограничен пользователем: цикл ждёт ввода и
      завершается по его команде. Это обычный REPL, а не бесконечный цикл без выхода, как в агентном цикле.
general_rubric:
  - name: Ложные замечания
    description: >-
      Нет замечаний к корректному коду. Например, fail fast на отсутствующем `LLM_API_KEY` в `config.py` и
      консольный цикл `while True` с выходом по `exit`/`quit` в `main.py` исправлять не нужно. Не засчитываются
      замечания про стиль и "лучше бы использовать фреймворк", не связанные с рисками.
    weight: 1
  - name: Приоритеты и вердикт
    description: >-
      Главными названы отсутствие предела шагов, необработанная ошибка инструмента и выполнение команд модели
      без ограничений, а мелочи (повторы без паузы) поставлены ниже. Вердикт request_changes.
    weight: 1
expected_verdict: request_changes
