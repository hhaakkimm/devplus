# Эталонных ответов нет: каждый ответ оценивает судья по рубрике.
model: claude-haiku-5-5
effort: low
max_tokens: 400
variables: [complaint]
pass_threshold: 0.8
graders:
  - type: llm_judge
    threshold: 0.7
    rubric:
      - name: Вежливость
        description: >-
          Тон уважительный и спокойный: есть извинение за неудобства, нет грубости, сарказма,
          канцелярских отписок и попыток переложить вину на клиента.
      - name: Решение проблемы
        description: >-
          Ответ называет конкретный следующий шаг по жалобе (возврат, замена, проверка, срок)
          или просит недостающие данные. Он не обещает того, о чём клиент не просил, и не
          выдумывает факты о заказе.
      - name: Краткость
        description: >-
          Ответ укладывается в три-пять предложений: без длинного вступления, пересказа жалобы
          и повторов.
cases:
  - variables: {complaint: "Заказ №48213 должен был приехать три дня назад, курьер не отвечает, а в приложении статус не меняется. Этот подарок нужен мне к субботе!"}
  - variables: {complaint: "Купила у вас блендер, через две недели он перестал включаться. Гарантийный талон потеряла, но чек остался в почте. Что мне теперь делать?"}
  - variables: {complaint: "С меня дважды списали оплату за подписку, 499 рублей. Поддержка уже неделю присылает одинаковые отписки. Верните деньги."}
  - variables: {complaint: "Сотрудник в вашем отделении на Ленина, 12 разговаривал со мной грубо и сказал «не нравится — идите к конкурентам». Хочу, чтобы это разобрали."}
