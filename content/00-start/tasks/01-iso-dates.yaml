# Значения в кавычках: без них YAML превратит 2024-03-05 в дату, и файл не пройдёт проверку.
model: claude-haiku-5-5
effort: low
max_tokens: 1024
variables: [text]
pass_threshold: 0.8
graders:
  - type: exact
cases:
  - variables: {text: "Договор подписан 5 марта 2024 года в Москве."}
    expected: "2024-03-05"
  - variables: {text: "Релиз перенесли на 17.09.2023, команда предупреждена."}
    expected: "2023-09-17"
  - variables: {text: "Счёт выставлен 9 мая 2021 г., оплатить нужно в течение недели."}
    expected: "2021-05-09"
  - variables: {text: "Заявка поступила 31/07/2022 в 14:30."}
    expected: "2022-07-31"
  - variables: {text: "Конференция пройдёт в пятницу, 1 декабря 2023 года."}
    expected: "2023-12-01"
  - variables: {text: "Сотрудник вышел на работу двадцать второго января две тысячи девятнадцатого года."}
    expected: "2019-01-22"
